"Gisborne, Tolaga Bay (Uawa)","cat":"outdoors","detail":"660 m wharf at Tolaga Bay, which newzealand.com describes as the longest in the Southern Hemisphere. It is north of Gisborne on the Pacific Coast Highway, near where Cook met Te Aitanga a Hauiti.","url":null,"lat":-38.378437,"lng":178.322461,"trail":null,"difficulty":null,"verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":true,"gem":false,"kids":true,"hike":false,"south":false},{"id":"eastwoodhill","name":"Eastwoodhill Arboretum","place":"Gisborne, Ngātapa (Wharekopae Road)","cat":"outdoors","detail":"New Zealand's National Arboretum, with over 25,000 species of exotic and native trees, shrubs and climbers and about 25 km of tracks, from flat tree-lined paths to a steep climb up Mt Arateitei. It is on the road out to Rere at 2392 Wharekopae Road. Open 9am to 4pm daily except Christmas Day; pay entry by QR code, honesty box or bank transfer.","url":"https://www.eastwoodhill.org.nz","lat":-38.5625455,"lng":177.7182691,"trail":"About 25 km of tracks","difficulty":null,"verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"greenhilllodge","name":"Greenhill Lodge","place":"Hastings","cat":"stay","detail":"Greenhill Lodge is a boutique retreat on a hilltop at 103 Greenhill Road, overlooking lush farm and grazing land southwest of Hastings. The lodge was built in the late 1800s and has four spacious ensuite bedrooms that open onto verandas or courtyards. Guests have large open fires, a billiard room, dining and drawing rooms, a swimming pool and a private hot tub, all surrounded by mature historic trees.","url":null,"lat":-39.6897733,"lng":176.714652,"trail":null,"difficulty":null,"verify":true,"day":"18","distance":null,"north":true,"gem":false,"hike":false,"south":false},{"id":"stratfordmountainhouse","name":"Ngāti Ruanui Mountain Lodge (Stratford Mountain House)","place":"Taranaki, Pembroke Road, east side of the maunga","cat":"stay","detail":"Alpine lodge on the eastern slopes of Taranaki Maunga inside the national park, with 10 chalet rooms, spa baths and a 30-seat bistro. Easy walking tracks are nearby. Listed as open Wednesday to Sunday from 9am, all year.","url":"https://stratfordmountainhouse.co.nz","lat":-39.306282,"lng":174.122605,"trail":null,"difficulty":null,"verify":true,"day":null,"distance":null,"north":true,"gem":false,"hike":false,"south":false},{"id":"swingbridgetrack","name":"Swingbridge Track, Kaitoke","place":"Upper Hutt, Kaitoke Regional Park","cat":"hikes","detail":"Short, family-friendly loop from the Kaitoke Regional Park campground that crosses a swing bridge high above the Hutt River (Te Awa Kairangi). The park was the Rivendell filming location for The Lord of the Rings. Park in the large car park off Waterworks Road; dogs are allowed on a lead.","url":"https://www.wellingtonnz.com/visit/trails/swingbridge-track","lat":-41.06702,"lng":175.19892,"trail":"2.1 km loop, about 1 hour","difficulty":"Easiest: short walk","verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":true,"south":false},{"id":"botanicgarden","name":"Wellington Botanic Garden ki Paekaka","place":"Wellington, 101 Glenmore Street, Kelburn","cat":"outdoors","detail":"25 hectares of plant collections, seasonal displays and protected native forest with city views, a few minutes from Parliament and linked to the top of the Cable Car. Features include playgrounds, a duck pond, a sculpture walk and glow worm caves.","url":"https://www.wellingtonnz.com/visit/see-and-do/wellington-botanic-garden-ki-paekaka","lat":-41.2829,"lng":174.766,"trail":null,"difficulty":null,"verify":false,"day":"19","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false,"wiki":"Wellington_Botanic_Garden"},{"id":"pencarrow","name":"Pencarrow Coast Road and Lighthouse","place":"Lower Hutt, East Harbour Regional Park","cat":"outdoors","detail":"Flat walk or bike ride from Burdan's Gate, just south of Eastbourne, along the coast to Pencarrow Lighthouse. Lakes Kohangatera and Kohangapiripiri, about 2 km further, support native waterfowl, eels and fish.","url":null,"lat":-41.3113817,"lng":174.8831963,"trail":"7 km one way to the lighthouse, plus 2 km to Lake Kohangatera","difficulty":null,"verify":false,"day":"19","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"remutakacycletrail","name":"Remutaka Cycle Trail","place":"Petone to Orongorongo River","cat":"outdoors","detail":"A 122 km Great Ride in four sections from the Petone foreshore to the mouth of the Orongorongo River. The rail section crosses the Siberia Gully bridge and runs through old railway tunnels. Allow 2 to 3 days for the full trail or ride a shorter section.","url":null,"lat":-41.226312,"lng":174.872131,"trail":"122 km, 2 to 3 days","difficulty":null,"verify":true,"day":"19","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"hike":false,"south":false},{"id":"orientalbay","name":"Oriental Bay","place":"Wellington, Oriental Parade","cat":"outdoors","detail":"Oriental Bay is a harbourside bay and suburb of Wellington, known both as a popular city beach and an affluent neighbourhood. Its beach was rebuilt in 2004 with sand brought from Golden Bay. A promenade lined with Norfolk pines runs along the waterfront.","url":null,"lat":-41.29167,"lng":174.79444,"trail":null,"difficulty":null,"verify":true,"day":"19","distance":null,"north":true,"gem":false,"hike":false,"south":false},{"id":"lakeferry","name":"Lake Ferry","place":"Wairarapa, Lake Ferry","cat":"outdoors","detail":"Remote coastal stop on the way to Cape Palliser. The Spinoff (May 2026) calls the Lake Ferry Pub's fish and chips solid with epic views: eat at the bar if the weather is wild, or on the beach if it is calm.","url":null,"lat":-41.39421,"lng":175.14374,"trail":null,"difficulty":null,"verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"ngawi","name":"Ngawi","place":"Wairarapa, near Cape Palliser","cat":"outdoors","detail":"Former crayfish processing village where tractors haul fishing boats in and out of the Cook Strait surf. It is now a holiday spot with pop-up food options.","url":null,"lat":-41.5875944,"lng":175.2347444,"trail":null,"difficulty":null,"verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":true,"gem":false,"kids":true,"hike":false,"south":false},{"id":"matiusomes","name":"Matiu/Somes Island","place":"Wellington Harbour, ferry from Queens Wharf or Days Bay","cat":"wildlife","detail":"DOC reserve and wildlife refuge with a long history of Maori occupation and later use as a quarantine station, internment camp and military site. Ferries run from Queens Wharf and Days Bay by booking only, and every visitor goes through a biosecurity check. There is no food or drink on the island, so bring your own.","url":"https://eastbywest.co.nz/ferry-services/matiu-somes-island/","lat":-41.25825,"lng":174.865389,"trail":null,"difficulty":null,"verify":true,"day":"19","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false,"wiki":"Matiu_/_Somes_Island"},{"id":"pukeahu","name":"Pukeahu National War Memorial Park","place":"Wellington, Buckle Street, Mt Cook","cat":"history","detail":"Memorial park opened in April 2015 in front of the National War Memorial, with memorials from Australia, the UK, the US, Belgium, France and Turkey. The National War Memorial has the Hall of Memories, a 74 bell carillon and the Tomb of the Unknown Warrior. The hill was a sacred site and garden for Ngai Tara.","url":null,"lat":-41.29889,"lng":174.77722,"trail":null,"difficulty":null,"verify":true,"day":"19","distance":null,"north":true,"indoor":false,"quick":true,"gem":false,"kids":true,"hike":false,"south":false,"wiki":"Pukeahu_National_War_Memorial_Park"},{"id":"cubastreet","name":"Cuba Street","place":"Wellington, Te Aro","cat":"towns","detail":"Heritage street of independent shops, cafes and restaurants, home to the interactive Bucket Fountain sculpture.","url":null,"lat":-41.2935,"lng":174.7756,"trail":null,"difficulty":null,"verify":false,"day":"19","distance":null,"north":true,"indoor":false,"quick":true,"gem":false,"kids":true,"hike":false,"south":false},{"id":"martinborough","name":"Martinborough","place":"Wairarapa","cat":"towns","detail":"Wine village with over 20 wineries, most within walking distance of its Union Jack shaped square, known for pinot noir. Walk or cycle with a wine map or take a guided tour; Toast Martinborough festival is in January. The Spinoff (May 2026) recommends Nara on the square, Kitcheners and the Martinborough Bakery.","url":null,"lat":-41.21889,"lng":175.45917,"trail":null,"difficulty":null,"verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"hike":false,"south":false},{"id":"greytown","name":"Greytown","place":"Wairarapa","cat":"towns","detail":"Founded in 1854 as New Zealand's first planned inland town, with wooden Victorian buildings along a main street of boutiques, galleries and cafes. Local food stops include Schoc Chocolate and The French Baker; tandem bikes can be hired for the countryside.","url":null,"lat":-41.08,"lng":175.461,"trail":null,"difficulty":null,"verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"parrotdog","name":"Parrotdog Bar","place":"Wellington, 66 Kingsford Smith Street, Rongotai","cat":"brewery","detail":"Brewery bar one block back from Lyall Bay beach near the airport, with 17 rotating taps, pub food, a pool table and a view into the brewery. The Nice. Takeaway cellar door next door fills flagons. Hours are not listed.","url":"https://parrotdog.co.nz/","lat":-41.327262613965,"lng":174.79976785,"trail":null,"difficulty":null,"verify":true,"day":"19","distance":null,"north":true,"indoor":true,"quick":false,"gem":false,"hike":false,"south":false},{"id":"hbfarmersmarket","name":"Hawke's Bay Farmers' Market","place":"Hastings, Tomoana Showgrounds","cat":"food","detail":"One of the country's oldest and largest farmers markets, held in the Waikoko Gardens at Tomoana Showgrounds with seasonal produce and music. Every Sunday 8.30am to 12.30pm, closed on public holidays.","url":"http://www.hawkesbayfarmersmarket.co.nz/","lat":-39.62824,"lng":176.86021,"trail":null,"difficulty":null,"verify":false,"day":"18","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"tanestrackwaterfall","name":"Tane's Track, Tunnel Gully","place":"Upper Hutt, Tunnel Gully","cat":"falls","detail":"A 2.3 km walk from the Tunnel Gully lower picnic area through black beech forest up to Collins Stream and a waterfall. It is sheltered from southerlies and dog friendly.","url":"https://www.wellingtonnz.com/visit/trails/top-trails-in-the-hutt-valley","lat":-41.10392,"lng":175.15342,"trail":"2.3 km, about 1 hour","difficulty":null,"verify":false,"day":null,"distance":null,"north":true,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"escarpmenttrack","name":"Paekakariki Escarpment Track","place":"Kapiti Coast, Paekakariki to Pukerua Bay","cat":"hikes","detail":"A steep, narrow and exposed section of Te Araroa above the coast between Paekakariki and Pukerua Bay, with about 1,200 steps and two 40 m swing bridges. It climbs to a 220 m lookout over the sea. Allow 3 to 4 hours one way, carry water, and use the train to get back; there are no handrails on the steps and it is not for anyone with vertigo.","url":"https://www.herengaanuku.govt.nz/track/escarpment-track/pdfPreview","lat":-40.98722,"lng":174.95444,"trail":"10.3 km one way, 3 to 4 hours","difficulty":"Medium","verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":false,"hike":true,"south":false},{"id":"kapitiisland","name":"Kapiti Island Nature Tours","place":"Kapiti Coast, departs Paraparaumu Beach","cat":"wildlife","detail":"Guided day trips and overnight stays on one of NZ's oldest nature reserves, home to takahe, kaka, saddleback and about 1,400 little spotted kiwi that overnight guests may see. The day tour leaves the Kapiti Boating Club about 9am and returns about 3pm, with a guided walk and cooked lunch; adults from $325 (child $209). Sailings are weather dependent and confirmed the day before.","url":"https://www.bookme.co.nz/things-to-do/wellington-wairarapa/activity/kapiti-day-tour-kapiti-island-nature-tours/8380","lat":-40.831735,"lng":174.943456,"trail":null,"difficulty":null,"verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"southwardcar","name":"Southward Car Museum","place":"Kapiti Coast, 250 Otaihanga Road, Paraparaumu","cat":"history","detail":"Large private car collection built from the legacy of Sir Len Southward, with more than 400 vehicles and exhibits over three floors. Open daily 9am to 4:30pm (last entry 4pm), closed Good Friday and Christmas Day; adults $23, children $6, family $52.","url":"https://www.southwardcarmuseum.co.nz","lat":-40.89413,"lng":175.02871,"trail":null,"difficulty":null,"verify":false,"day":null,"distance":null,"north":true,"indoor":true,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"interislanderterminal","name":"Interislander Wellington terminal (Kaiwharawhara)","place":"Wellington, Kaiwharawhara, off SH1 at Aotea Quay","cat":"outdoors","detail":"Wellington terminal for the Interislander ferry to Picton. From SH1 southbound take the Aotea Quay off-ramp and follow signs for Motorway North / Interislander. Vehicle check-in closes 60 minutes before departure; foot passengers check in at the passenger terminal.","url":"https://www.interislander.co.nz/plan/kaiwharawhara-wellington-terminal-vehicle-check-in","lat":-41.264106613934,"lng":174.78698735,"trail":null,"difficulty":null,"verify":true,"day":"19","distance":null,"north":true,"indoor":true,"quick":false,"gem":false,"kids":true,"hike":false,"south":false}],"chapters":[{"id":"ch1","label":"Chapter 1","title":"Queenstown to Central Otago through Gibbston","badges":["Wine","Gorge drive"],"blocks":[{"kind":"intro","title":"","html":"<p>Pick up the car in Queenstown and head east through the Kawarau Gorge and the Gibbston wine valley to Alexandra, in the heart of Central Otago.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Lunch:</strong> <strong>Amisfield</strong> at Lake Hayes has a cellar door and bistro; its dinner restaurant holds a Michelin star (open Wednesday to Sunday).</li><li><strong>Gibbston:</strong> <strong>Gibbston Valley Winery</strong>, one of the valley's pioneers, runs tours of its wine cave. <strong>Chard Farm</strong>, <strong>Kinross</strong> and <strong>Mt Rosa</strong> are nearby.</li><li><strong>Evening:</strong> settle in around Alexandra.</li></ul>"}]},{"id":"ch2","label":"Chapter 2","title":"Bannockburn, Cromwell, and the Alexandra basin","badges":["Wine","Cycling","Hot tubs"],"blocks":[{"kind":"intro","title":"","html":"<p>A day around Pinot Noir country: cellar doors in Bannockburn and the Cromwell basin, a ride on the trails, and a soak.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Ride:</strong> hire bikes in Alexandra (<strong>Altitude Bikes</strong>) for the trails around Clyde and Lake Dunstan.</li><li><strong>Bannockburn:</strong> <strong>Mt Difficulty</strong>, <strong>Te Kano</strong>, <strong>Terra Sancta</strong> and <strong>Carrick</strong> have cellar doors. <strong>Felton Road</strong> is by appointment only.</li><li><strong>Cromwell basin:</strong> <strong>Quartz Reef</strong> and <strong>Wooing Tree</strong>.</li><li><strong>Soak:</strong> <strong>River Rock Estate</strong>'s private hot pools (adults only).</li></ul>"}]},{"id":"ch3","label":"Chapter 3","title":"The northern Catlins: waterfalls and sea lions","badges":["Waterfalls","Wildlife","Coast"],"blocks":[{"kind":"intro","title":"","html":"<p>South to the Catlins, a coast of forest, waterfalls, and wildlife. Roads are winding and some are gravel, so allow the whole day.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Nugget Point:</strong> an easy 20 minute return walk to the 1870 lighthouse above The Nuggets. The <strong>Roaring Bay</strong> hide is nearby.</li><li><strong>Cannibal Bay</strong> and <strong>Surat Bay</strong>: sea lions haul out on the sand. Keep your distance.</li><li><strong>Purakaunui Falls</strong>, three tiers through beech and podocarp forest, then <strong>Matai and Horseshoe Falls</strong> and <strong>McLean Falls</strong>.</li><li><strong>Florence Hill Lookout</strong> over <strong>Tautuku Bay</strong>.</li></ul>"},{"kind":"more","title":"Food and fuel","folded":true,"html":"<ul><li>Owaka has a café and bakery, the <strong>Lumberjack</strong>, and a Four Square. Some Papatowai places, like the <strong>Lost Gypsy</strong>, close for winter.</li></ul>"}]},{"id":"ch4","label":"Chapter 4","title":"The southern Catlins: Curio Bay and Slope Point","badges":["Fossil forest","Dolphins","Penguins"],"blocks":[{"kind":"intro","title":"","html":"<p>The wild southern end of the Catlins.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Cathedral Caves</strong>, sea caves reached only around low tide: check the gate times on the day.</li><li><strong>Curio Bay</strong>, a fossil forest about 180 million years old, exposed at low tide. Yellow-eyed penguins nest here; stay behind the barriers.</li><li><strong>Porpoise Bay</strong>, where Hector's dolphins often come in during summer. Swim at least 50 m from them and let them approach you.</li><li><strong>Slope Point</strong>, the South Island's southernmost point, a 20 minute walk each way. The track closes September to November for lambing.</li><li><strong>Waipapa Point Lighthouse</strong> on the way west.</li></ul>"}]},{"id":"ch5","label":"Chapter 5","title":"Dunedin and the Otago Peninsula","badges":["Albatross","Penguins","City"],"blocks":[{"kind":"intro","title":"","html":"<p>North to Dunedin for the city and the wildlife of the Otago Peninsula. On the way, the <strong>Historic Railway Tunnel</strong> near Owaka is a short walk.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Royal Albatross Centre</strong> at Taiaroa Head, beside a northern royal albatross colony. Book the guided tour.</li><li><strong>The OPERA</strong>: guided walks through covered trenches to hides over yellow-eyed penguin nests. Book ahead.</li><li><strong>Pilots Beach</strong> for little blue penguins at dusk, or a <strong>Monarch Wildlife Cruise</strong>.</li><li><strong>In town:</strong> the <strong>Railway Station</strong> (1906), <strong>Baldwin Street</strong>, the <strong>Otago Museum</strong> and the <strong>Botanic Garden</strong>.</li></ul>"}]},{"id":"ch6","label":"Chapter 6","title":"Invercargill, Bluff, and the Southern Scenic Route","badges":["Coast","Museum","Long drive"],"blocks":[{"kind":"intro","title":"","html":"<p>A full driving day: south to Invercargill and Bluff, then west along the Southern Scenic Route to Te Anau.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Bluff:</strong> the <strong>Stirling Point</strong> signpost at the end of State Highway 1 and the <strong>Bluff Hill Lookout</strong> over Foveaux Strait.</li><li><strong>Invercargill:</strong> <strong>Bill Richardson Transport World</strong> (allow a couple of hours), and lunch at <strong>The Batch</strong>.</li><li><strong>West:</strong> <strong>Riverton</strong>, <strong>Gemstone Beach</strong> at low tide, <strong>Monkey Island</strong>, <strong>McCracken's Rest</strong>, and the <strong>Clifden Suspension Bridge</strong> before Te Anau.</li></ul>"}]},{"id":"ch7","label":"Chapter 7","title":"Te Anau","badges":["Lakes","Takahē","Easy day"],"blocks":[{"kind":"intro","title":"","html":"<p>An easier day in the lakeside gateway to Fiordland.</p>"},{"kind":"route","title":"The day","html":"<ul><li>Walk the <strong>Kepler Track</strong> along the lakeshore to Brod Bay.</li><li>The <strong>Te Anau Bird Sanctuary</strong> on the lakefront has takahē.</li><li>An evening trip to the <strong>Te Anau Glowworm Caves</strong>, by boat across the lake.</li><li>Stock up for tomorrow: there is no fuel past Te Anau on the Milford Road.</li></ul>"}]},{"id":"ch8","label":"Chapter 8","title":"The Milford Road and Milford Sound","badges":["Fiord","Waterfalls","Big day"],"blocks":[{"kind":"intro","title":"","html":"<p>The Milford Road runs about 120 km from Te Anau to Milford Sound, through the Homer Tunnel. Leave early, and fuel up in Te Anau.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Mirror Lakes</strong>: best early, before the wind.</li><li><strong>Key Summit</strong> from The Divide, about an hour and a half up for views over the Humboldt and Darran Mountains.</li><li><strong>The Chasm</strong> near the Milford end.</li><li><strong>Milford Sound</strong>: cruises leave from the Visitor Terminal, a 10 minute walk from the car park. Book ahead.</li></ul>"},{"kind":"more","title":"For experienced hikers","folded":true,"html":"<ul><li><strong>Gertrude Saddle</strong> is an advanced route, only in settled weather, and not recommended in the avalanche season (usually May to November).</li></ul>"}]},{"id":"ch9","label":"Chapter 9","title":"Glenorchy and the head of the lake","badges":["Hikes","Lakes","Scenery"],"blocks":[{"kind":"intro","title":"","html":"<p>Back to Queenstown and on to Glenorchy, about 40 minutes up Lake Wakatipu, with stops along the way.</p>"},{"kind":"route","title":"The day","html":"<ul><li>On the drive: <strong>Bob's Cove</strong> and the <strong>Bennetts Bluff</strong> lay-by.</li><li><strong>Glenorchy:</strong> the <strong>Glenorchy Walkway</strong> around the lagoon and <strong>Mrs Woolly's General Store</strong>.</li><li><strong>Walks:</strong> the <strong>Routeburn Track</strong> from its road end, the easy <strong>Lake Sylvan</strong> walk, or, for experienced trampers, the <strong>Earnslaw Burn</strong>.</li></ul>"}]},{"id":"ch10","label":"Chapter 10","title":"Wānaka, the Crown Range, and Arrowtown","badges":["Wine","Lakes","Gold rush"],"blocks":[{"kind":"intro","title":"","html":"<p>A loop through Wānaka and over the Crown Range to Arrowtown and back to Queenstown.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Wānaka:</strong> <strong>Rippon</strong>'s lakeside cellar door, with free tastings, and the town's breweries.</li><li><strong>Cardrona:</strong> the <strong>Cardrona Hotel</strong> and <strong>Cardrona Distillery</strong>.</li><li><strong>Arrowtown:</strong> pies at the <strong>Arrowtown Bakery</strong> and a walk along the river.</li><li><strong>Evening:</strong> a soak at <strong>Onsen Hot Pools</strong>. Book well ahead.</li></ul>"},{"kind":"more","title":"If you have more time","folded":true,"html":"<ul><li><strong>Rob Roy Track</strong> from Raspberry Flat, past Wānaka.</li><li><strong>Lake Tekapo</strong>, <strong>Aoraki/Mount Cook</strong> and the <strong>Omarama Clay Cliffs</strong> make a separate trip north. The West Coast glaciers are another.</li></ul>"}]},{"id":"ch11","label":"Chapter 11","title":"Auckland","badges":["City","Museum","Islands"],"blocks":[{"kind":"intro","title":"","html":"<p>Start in New Zealand's biggest city.</p>"},{"kind":"route","title":"The day","html":"<ul><li>The <strong>Auckland War Memorial Museum</strong> in the Domain, with a Māori cultural performance twice a day.</li><li>A ferry to <strong>Rangitoto</strong> and the 7 km return walk to the summit over volcanic scoria, or to <strong>Waiheke</strong> for vineyards like <strong>Mudbrick</strong>.</li><li>Evening: dinner in town or at the <strong>Garage Project</strong> taproom in Kingsland.</li></ul>"},{"kind":"more","title":"If you have more time","folded":true,"html":"<ul><li><strong>Piha</strong>, the black sand surf beach on the west coast.</li><li>Northland and the Bay of Islands make a separate loop north: Waitangi, Russell, Waipoua Forest and Cape Reinga.</li></ul>"}]},{"id":"ch12","label":"Chapter 12","title":"Coromandel: Cathedral Cove and Hot Water Beach","badges":["Beaches","Coast"],"blocks":[{"kind":"intro","title":"","html":"<p>East to the Coromandel Peninsula and its Mercury Bay beaches.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Karangahake Gorge</strong> on the way, for the old mining tunnels of the Windows Walk.</li><li><strong>Mautohe Cathedral Cove</strong>: there is no parking at the track end, so use the Hahei car park or the shuttle. DOC closes the track after heavy rain.</li><li><strong>Hot Water Beach</strong>: within two hours either side of low tide, dig your own pool in the sand.</li><li>Stay in <strong>Whitianga</strong>; <strong>The Lost Spring</strong> has geothermal pools in town.</li></ul>"}]},{"id":"ch13","label":"Chapter 13","title":"Hobbiton and Hamilton","badges":["Film set","Gardens"],"blocks":[{"kind":"intro","title":"","html":"<p>Across the Waikato to the Shire and Hamilton.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Hobbiton Movie Set</strong> near Matamata: guided tours through the 12-acre Shire, ending at the Green Dragon Inn. Book ahead.</li><li><strong>Hamilton Gardens</strong>: 19 themed Enclosed Gardens. Visitors from outside Hamilton pay for the Enclosed Gardens.</li></ul>"}]},{"id":"ch14","label":"Chapter 14","title":"Waitomo caves and Marokopa Falls","badges":["Glowworms","Caves","Waterfalls"],"blocks":[{"kind":"intro","title":"","html":"<p>A day underground and in the limestone country around Waitomo.</p>"},{"kind":"route","title":"The day","html":"<ul><li>The <strong>Waitomo Glowworm Caves</strong>, ending with a silent boat ride under the glowworms, or the small-group <strong>Spellbound</strong> tour.</li><li><strong>Ruakuri Cave</strong>, entered by a spiral ramp, and the free <strong>Ruakuri Walk</strong> through a forested gorge.</li><li><strong>Marokopa Falls</strong>, 35 m, a 20 minute walk off Te Anga Road west of Waitomo.</li></ul>"}]},{"id":"ch15","label":"Chapter 15","title":"Rotorua: geysers and Māori culture","badges":["Geothermal","Culture","Hot pools"],"blocks":[{"kind":"intro","title":"","html":"<p>A day in Rotorua's geothermal valleys and Māori villages.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Wai-O-Tapu</strong> in the morning for the Champagne Pool.</li><li><strong>Whakarewarewa</strong>, the living village of Tūhourangi Ngāti Wāhiao, or <strong>Te Puia</strong> with Pōhutu Geyser.</li><li>The <strong>Redwoods Treewalk</strong>: 28 suspension bridges between redwoods, also lit at night.</li><li>Evening soak at the <strong>Polynesian Spa</strong> or <strong>Wai Ariki</strong>.</li></ul>"}]},{"id":"ch16","label":"Chapter 16","title":"Taupō and Huka Falls","badges":["Waterfalls","Geothermal","Lake"],"blocks":[{"kind":"intro","title":"","html":"<p>South to Lake Taupō, a huge volcanic caldera.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Orakei Korako</strong> on the way, reached by a short ferry across Lake Ohakuri.</li><li><strong>Huka Falls</strong>, where the Waikato River squeezes into a 15 m canyon. Walk in from <strong>Spa Park</strong>, past the free hot stream.</li><li><strong>Craters of the Moon</strong> geothermal walkway.</li></ul>"}]},{"id":"ch17","label":"Chapter 17","title":"Tongariro National Park","badges":["Alpine","Volcanoes","Big day"],"blocks":[{"kind":"intro","title":"","html":"<p>The volcanoes of Tongariro National Park. Check the weather and DOC alerts first: conditions change fast up high.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Tongariro Alpine Crossing</strong>, a one-way alpine day hike to Red Crater. In summer there is no visitor parking at Mangatepopo, so book a shuttle.</li><li>Or easier walks from Whakapapa Village: <strong>Taranaki Falls</strong>, and further on the <strong>Tama Lakes</strong>.</li></ul>"}]},{"id":"ch18","label":"Chapter 18","title":"Napier and Hawke's Bay","badges":["Art Deco","Wine","Views"],"blocks":[{"kind":"intro","title":"","html":"<p>East to Hawke's Bay: an Art Deco city and wine country.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Napier</strong>, rebuilt in Art Deco style after the 1931 earthquake: take an <strong>Art Deco Trust</strong> walking or vintage car tour.</li><li><strong>Te Mata Peak</strong> above Havelock North, with a sealed road to the summit.</li><li>Cellar doors: <strong>Mission Estate</strong> and <strong>Craggy Range</strong>.</li></ul>"}]},{"id":"ch19","label":"Chapter 19","title":"Wellington","badges":["Capital","Museums","Food"],"blocks":[{"kind":"intro","title":"","html":"<p>The capital, and the ferry to the South Island.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Te Papa</strong>, the national museum on the waterfront (free for NZ residents; international visitors pay).</li><li>The <strong>Cable Car</strong> up to Kelburn and the Botanic Garden, and <strong>Mount Victoria</strong> for the view.</li><li><strong>Zealandia</strong> for native birds, with night tours to look for kiwi.</li><li>Evening on <strong>Cuba Street</strong>, or a pint at <strong>Garage Project</strong>.</li></ul>"},{"kind":"more","title":"Crossing to the South Island","folded":true,"html":"<ul><li>Interislander and Bluebridge ferries sail to Picton in about 3.5 hours. Many rental companies don't allow cars on the ferry, so check yours.</li></ul>"}]}],"links":[{"label":"Road conditions (NZTA)","url":"https://journeys.nzta.govt.nz/"},{"label":"DOC alerts","url":"https://www.doc.govt.nz/alerts/"},{"label":"MetService weather","url":"https://www.metservice.com/"},{"label":"DOC parks and recreation","url":"https://www.doc.govt.nz/parks-and-recreation/"},{"label":"GeoNet hazards","url":"https://www.geonet.org.nz/"}],"sample":{"name":"South Island Deep South","days":[{"title":"Queenstown to Central Otago through Gibbston","chapter":"ch1","ideasDay":"1","stops":["amisfield","gibbstonvalley","chardfarm","kinross"]},{"title":"Bannockburn, Cromwell, and the Alexandra basin","chapter":"ch2","ideasDay":"2","stops":["altitudebikes","mtdifficulty","carrick","quartzreef","riverrock"]},{"title":"The northern Catlins","chapter":"ch3","ideasDay":"3","stops":["nuggetpoint","cannibalbay","purakaunuifalls","mcleanfalls","florencehill"]},{"title":"The southern Catlins","chapter":"ch4","ideasDay":"4","stops":["cathedralcaves","curiobay","porpoisebay","slopept","waipapapoint"]},{"title":"Dunedin and the Otago Peninsula","chapter":"ch5","ideasDay":"5","stops":["dunedinrailway","baldwinstreet","albatrosscentre","theOpera","pilotsbeach"]},{"title":"Invercargill, Bluff, and the Southern Scenic Route","chapter":"ch6","ideasDay":"6","stops":["stirlingpoint","billrichardson","gemstonebeach","mccrakensrest","clifdenbridge"]},{"title":"Te Anau","chapter":"ch7","ideasDay":"7","stops":["kepler","teanaubirds","teanaucaves","redcliff"]},{"title":"The Milford Road and Milford Sound","chapter":"ch8","ideasDay":"8","stops":["mirrorlakes","keysummit","thechasm","milford"]},{"title":"Glenorchy and the head of the lake","chapter":"ch9","ideasDay":"9","stops":["bobscove","bennettbluff","glenlagoon","mrswoolly","lakesylvan"]},{"title":"Wānaka, the Crown Range, and Arrowtown","chapter":"ch10","ideasDay":"10","stops":["ripponvineyard","cardronahotel","arrowtownbakery","onsen"]}]},"samples":[{"name":"South Island Deep South","days":[{"title":"Queenstown to Central Otago through Gibbston","chapter":"ch1","ideasDay":"1","stops":["amisfield","gibbstonvalley","chardfarm","kinross"]},{ ":"15","stops":["waiotapu","whakarewarewa","redwoods","polynesianspa"]},{"title":"Taupō and Huka Falls","chapter":"ch16","ideasDay":"16","stops":["orakeikorako","hukafallswalk","hukafalls","cratersmoon"]},{"title":"Tongariro National Park","chapter":"ch17","ideasDay":"17","stops":["taranakifalls","tamalakes"]},{"title":"Napier and Hawke's Bay","chapter":"ch18","ideasDay":"18","stops":["artdecotours","tematapeak","missionestate","craggyrange"]},{"title":"Wellington","chapter":"ch19","ideasDay":"19","stops":["tepapa","cablecar","mtvictoria","zealandia","cubastreet"]}]}],"reading":[{"title":"Arriving","icon":"info-circle","html":"<ul><li>If you travel visa-free under the visa waiver, request an NZeTA before you fly; most are processed within 72 hours. <!-- newzealand.com --></li><li>The International Visitor Conservation and Tourism Levy is NZ$100, paid with the NZeTA or visa. <!-- immigration.govt.nz --></li><li>Declare all food and anything used outdoors (boots, tents, hiking and fishing gear), and clean soil off boots before you fly. Not declaring a risk item brings an instant NZ$400 fine. <!-- mpi.govt.nz --></li></ul>"},{"title":"Driving","icon":"car","html":"<ul><li>Drive on the left. At one-lane bridges, signs show who has priority: give way when the sign says so. <!-- newzealand.com --></li><li>Limits are in km/h: 100 km/h (62 mph) on the open road by default, and 110 km/h (about 68 mph) on some signed expressways. Always follow the posted sign. <!-- Wikipedia, 1News --></li><li>You can drive on a current US licence for up to 18 months from arrival. <!-- newzealand.com --></li><li>Many rental companies don't allow their cars on the Cook Strait ferry; some swap you to another car on the other side. Check your company's inter-island policy. <!-- europcar.co.nz --></li></ul>"},{"title":"Walks, weather, and safety","icon":"alert-triangle","html":"<ul><li>In an emergency, dial <strong>111</strong> (free).</li><li>Check <a href=\"https://www.doc.govt.nz/alerts/\" target=\"_blank\" rel=\"noopener\">DOC alerts</a> before any walk. Great Walk huts and campsites are booked on DOC's booking system and popular tracks sell out within minutes of opening. <!-- doc.govt.nz --></li><li>Mountain weather can change quickly at any time of year: carry warm, waterproof layers even in summer. Avalanches usually occur in Fiordland from May to November. <!-- doc.govt.nz, frommers.com --></li><li>The sun is strong, especially September to April between 10am and 4pm, even on cloudy days. Pack insect repellent for sandflies near rivers and lakes. <!-- newzealand.com, frommers.com --></li></ul>"},{"title":"Money and camping","icon":"info-circle","html":"<ul><li>Tipping isn't expected; 15% GST is included in displayed prices. Visa and Mastercard are widely accepted. <!-- newzealand.com --></li><li>Freedom camping on council land generally needs a certified self-contained vehicle with a green warrant. <!-- traveltrade.newzealand.com --></li><li>Daylight saving runs from the last Sunday in September to the first Sunday in April, and the seasons are the reverse of the US. <!-- timeanddate.com, newzealand.com --></li></ul>"}],"retired":{},"guide":{"lede":"Tours by theme and by region. Open one to read about it, see its places on the map, and add the ones you like to your trip.","picks":5,"tours":[{"id":"waterfalls","kind":"theme","title":"Waterfalls","intro":"Waterfalls from the Catlins and Fiordland to Northland and the central North Island.","icon":null,"group":null,"reading":null,"stops":["humboldfalls","koropuku","waipohatu","hukafalls","marokopafalls","mcleanfalls","purakaunuifalls","taranakifalls","thechasm","birchvilledamfalls","bridalveilfalls","dawsonfalls","harurufalls","hunuafalls","karekarefalls","kitekitefalls","korokorodamfalls","mangawherofalls","mataifalls","mclarenfalls","hundredfalls","tuteafalls","owharoafalls","percywaterfall","rainbowfalls","rerefalls","tanestrackwaterfall","omanawafalls","bridalveilfalls_ni","whangareifalls"]},{"id": async function loadConditions(s) {

  COND.cache[s.id] = { loading: true }; renderCard();
  try {
    const q = new URLSearchParams({ latitude: s.lat.toFixed(4), longitude: s.lng.toFixed(4),
      current: 'temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,is_day',
      temperature_unit: tempUnit, wind_speed_unit: windUnit, timezone: 'auto' });
    const jobs = [fetch('https://api.open-meteo.com/v1/forecast?' + q).then(r => r.json())];
    if (CONFIG.conditions.aurora) jobs.push(fetch('https://services.swpc.noaa.gov/json/planetary_k_index_1m.json').then(r => r.json()).catch(() => null));
    const [wx, kp] = await Promise.all(jobs);
    if (!wx || !wx.current) throw new Error('no data');
    if (Array.isArray(kp) && kp.length) { const last = kp[kp.length - 1]; const v = Number(last.estimated_kp ?? last.kp_index); if (!isNaN(v)) COND.kp = v; }
    COND.cache[s.id] = { wx: wx.current, at: Date.now() };
  } catch (e) { COND.cache[s.id] = { error: true }; }
  if (ui.selected === s.id) renderCard();
}
// Sunrise and sunset (the sunrise equation; within a minute or two of published times).
function sunTimes(d, lat, lng) {
  const rad = Math.PI / 180;
  const J = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 12) / 864e5 + 2440587.5;
  const n = Math.round(J - 2451545.0 + 0.0008);
  const Js = n - lng / 360;
  const M = ((357.5291 + 0.98560028 * Js) % 360 + 360) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
  const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.4397 * rad));
  const cosw = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec));
  if (cosw < -1) return { polar: 'day' };
  if (cosw > 1) return { polar: 'night' };
  const w = Math.acos(cosw) / rad, toMs = j => (j - 2440587.5) * 864e5;
  return { rise: toMs(Jt - w / 360), set: toMs(Jt + w / 360) };
}
const hrsMin = ms => { const m = Math.round(ms / 60e3); return `${Math.floor(m / 60)} h ${m % 60} min`; };
function daylightHtml(pt, label) {

  const body = r.polar === 'day' ? 'The sun does not set today.' : r.polar === 'night' ? 'The sun does not rise today.'
    : `Sunrise ${tm(r.rise)}, sunset ${tm(r.set)}: ${hrsMin(r.set - r.rise)} of daylight.`;
  return `<p class="daylight">${icon('sunrise')}<span><b>Today ${label ? 'at ' + esc(label) : 'in ' + esc(CONFIG.placeName)}:</b> ${body}${tz ? ` <small>Local time.</small>` : ''}</span></p>`;
}

// ---------- photos: each place's own Wikipedia article supplies its free lead photo ----------
// Only places with a "wiki" title (planners/<id>/wiki.json) get one. The photo and its credit load
// when the card opens and are remembered on this device (the image itself is kept by the service
// worker), so a card seen once still shows its photo offline. A photo is skipped when the image is
// a drawing, map, or logo, or when the article's own coordinates are far from the place.
const PHOTO_KEY = CONFIG.storagePrefix + '_photos_v1';
const PHOTO_MAX_MI = 15;
const WIKI_API = 'https://en.wikipedia.org/w/api.php';
const photoMeta = load(PHOTO_KEY, {});
const photoPending = {};
const PHOTO_REFRESH_MS = 30 * 864e5;   // look again after 30 days (an article may gain or change its photo)
const metaOf = s => { const m = photoMeta[s.id]; return m && m.title === s.wiki ? m : null; };
function photoHtml(s) {
  if (!s.wiki) return '';
  const m = metaOf(s);
  if (!m) return `<figure class="card-photo loading" data-photo="${s.id}" aria-hidden="true"></figure>`;
  if (!m.src) return '';
  return `<figure class="card-photo" data-photo="${s.id}">
    <img src="${esc(m.src)}" alt="Photo of ${esc(s.name)}" decoding="async" onerror="this.closest('figure').remove()">
    <figcaption>Photo: <a href="${esc(m.page)}" target="_blank" rel="noopener">${esc(m.credit)}</a></figcaption></figure>`;
}
const wikiUrl = q => WIKI_API + '?' + new URLSearchParams({ format: 'json', formatversion: '2', origin: '*', ...q });
const plainText = h => { const d = document.createElement('div'); d.innerHTML = h || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
async function fetchPhotoMeta(s) {
  const r1 = await (await fetch(wikiUrl({ action: 'query', titles: s.wiki.replace(/_/g, ' '), redirects: '1', prop: 'pageimages|coordinates',
    piprop: 'thumbnail|name', pithumbsize: '800', pilicense: 'free' }))).json();
  const pg = r1.query && r1.query.pages && r1.query.pages[0];
  if (!pg || pg.missing || !pg.thumbnail || !pg.pageimage) return { src: null };
  if (/\.svg$|logo|map|locator|seal|flag|coat[_ ]of[_ ]arms|icon|diagram/i.test(pg.pageimage)) return { src: null };
  const co = pg.coordinates && pg.coordinates[0];
  if (co && miles({ lat: co.lat, lng: co.lon }, s) > PHOTO_MAX_MI) return { src: null };
  const r2 = await (await fetch(wikiUrl({ action: 'query', titles: 'File:' + pg.pageimage, prop: 'imageinfo', iiprop: 'extmetadata',
    iiextmetadatafilter: 'Artist|LicenseShortName' }))).json();
  const fp = r2.query && r2.query.pages && r2.query.pages[0];
  const md = (fp && fp.imageinfo && fp.imageinfo[0] && fp.imageinfo[0].extmetadata) || {};
  const lic = plainText(md.LicenseShortName && md.LicenseShortName.value);
  if (!lic) return { src: null };   // no license we can show: no photo
  let artist = plainText(md.Artist && md.Artist.value);
  if (artist.length > 60) artist = artist.slice(0, 57).trim() + '...';
  return { src: pg.thumbnail.source, page: 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(pg.pageimage.replace(/ /g, '_')),
    credit: (artist ? artist + ', ' : '') + lic + ', via Wikipedia' };
}
function ensurePhoto(s) {
  if (!s || !s.wiki) return Promise.resolve(null);
  const have = metaOf(s);
  if (have && Date.now() - (have.at || 0) < PHOTO_REFRESH_MS) return Promise.resolve(have);
  if (photoPending[s.id]) return photoPending[s.id];
  photoPending[s.id] = fetchPhotoMeta(s).then(m => { photoMeta[s.id] = { ...m, title: s.wiki, at: Date.now() }; save(PHOTO_KEY, photoMeta); return photoMeta[s.id]; })
    .catch(() => null)    // offline or blocked: try again next time
    .finally(() => { delete photoPending[s.id]; });
  return photoPending[s.id];
}
function loadCardPhoto(s) {
  const fig = document.querySelector(`#card .card-photo.loading[data-photo="${s.id}"]`);
  if (!fig) { ensurePhoto(s); return; }   // already shown (or known to have none): refresh quietly when due
  ensurePhoto(s).then(() => {
    const f = document.querySelector(`#card .card-photo.loading[data-photo="${s.id}"]`);
    if (f) { if (metaOf(s)) f.outerHTML = photoHtml(s); else f.remove(); }
  });
}
function seasonHtml(s) {
  const bits = [];

  else {
    if (s.best && s.best.length < 12) bits.push(`Best ${monthSpan(s.best)}`);
    if (s.closedMonths && s.closedMonths.length) bits.push(`Usually closed ${monthSpan(s.closedMonths)}`);
  }
  if (!bits.length && !s.seasonNote) return '';
  return `<p class="season">${icon('calendar-event')}<span>${bits.length ? `<b>${esc(bits.join('. '))}.</b> ` : ''}${esc(s.seasonNote || '')}</span></p>`;
}

$('#card').addEventListener('click', e => {
  const b = e.target.closest('[data-act], [data-add], [data-near-add], [data-near-pick]'); if (!b) return;
  if (b.tagName === 'A') return;
  const id = ui.selected;
  if (b.dataset.add !== undefined) {
    const v = b.dataset.add; const target = v === 'new' ? 'new' : Number(v);
    const di = addToDay(id, target);
    ui.menuFor = null;
    toast(di === -1 ? 'Saved for someday' : `Added to ${dayLabel(di)}`);
    refreshAll(); return;
  }
  const act = b.dataset.act;
  if (act === 'close') closeCard();
  else if (act === 'add' || act === 'move') {
    ui.menuFor = ui.menuFor === id ? null : id; renderCard();
    const m = $('#card .add-menu'); if (m) { m.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); const f = m.querySelector('[data-add]:not([disabled])'); if (f) f.focus({ preventScroll: true }); }
  }
  else if (act === 'cancel-add') { ui.menuFor = null; renderCard(); }
  else if (act === 'visit') {
    if (visitOf(id) && (visitOf(id).stars || visitOf(id).note) && !confirm('Clear your rating and notes for this place?')) return;
    if (visitOf(id)) delete store.visits[id]; else store.visits[id] = { at: Date.now(), stars: 0, note: '' };
    persist(); renderCard(); renderMap(); renderTrip(); renderMoreIfOpen();
  }
  else if (act === 'star') { const v = visitOf(id); const n = Number(b.dataset.n); v.stars = v.stars === n ? 0 : n; persist(); renderCard(); renderTrip(); renderMoreIfOpen(); }
  else if (act === 'open') openCard(b.dataset.id, { fly: true });
  else if (b.dataset.nearAdd) { addToDay(b.dataset.nearAdd, Number(b.dataset.day)); toast(`Added ${BY_ID[b.dataset.nearAdd].name} to ${dayLabel(Number(b.dataset.day))}`); refreshAll(); }
  else if (b.dataset.nearPick) { openCard(b.dataset.nearPick, { fly: true }); ui.menuFor = b.dataset.nearPick; renderCard();
    const m = $('#card .add-menu'); if (m) m.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  else if (act === 'remove') { removeFromTrip(id); persist(); toast('Removed from your trip'); refreshAll(); }
  else if (act === 'cond') { loadConditions(S(id)); return; }
  else if (act === 'read') { ui.chapter = b.dataset.ch; ui.tour = null; showTab('guide'); }
  else if (act === 'tour') { ui.tour = b.dataset.tour; ui.chapter = null; showTab('guide'); $('#panel-body').scrollTop = 0; }
  else if (act === 'delplace') {
    const t = trip(); removeFromTrip(id); t.places = t.places.filter(p => p.id !== id); persist();
    closeCard(); refreshAll(); toast('Place deleted');
  }
});
$('#card').addEventListener('input', e => {
  if (e.target.id === 'visit-note') { const v = visitOf(ui.selected); if (v) { v.note = e.target.value; persist(); } return; }
  const t = trip(); const p = t && t.places.find(x => x.id === ui.selected); if (!p) return;
  if (e.target.id === 'mine-name') p.name = e.target.value.trim() || 'New place';
  if (e.target.id === 'mine-note') p.note = e.target.value;
  persist();
});

// ---------- trips from files and links ----------
// Checks and copies a trip that came from outside (an import or a share link): unknown places are
// skipped, text is trimmed, and everything gets fresh ids so it can't collide with your trips.
function normalizeTrip(raw) {
  if (!raw || !Array.isArray(raw.days)) throw new Error('not a trip');
  const places = (Array.isArray(raw.places) ? raw.places : [])
    .filter(p => p && isFinite(p.lat) && isFinite(p.lng) && Math.abs(p.lat) <= 90 && Math.abs(p.lng) <= 180).slice(0, 200)
    .map(p => ({ old: p.id, id: 'p_' + uid(), name: String(p.name || 'My place').slice(0, 80), note: String(p.note || '').slice(0, 1000), lat: +p.lat, lng: +p.lng }));
  const remap = Object.fromEntries(places.map(p => [p.old, p.id])); places.forEach(p => delete p.old);
  let dropped = 0;
  const clean = list => (Array.isArray(list) ? list : []).map(i => i && (remap[i.stop] || (String(i.stop).startsWith('p_') ? null : liveId(i.stop))))
    .filter(x => { if (!x) dropped++; return !!x; }).map(stop => ({ id: uid(), stop }));
  const trip = { id: uid(), name: String(raw.name || 'Shared trip').slice(0, 80) || 'Shared trip', created: Date.now(),
    days: raw.days.slice(0, 60).map(d => ({ id: uid(), title: String((d && d.title) || '').slice(0, 120), note: String((d && d.note) || '').slice(0, 2000),
      chapter: d && CHAPTERS[d.chapter] ? d.chapter : undefined, ideasDay: d && d.ideasDay && CHAPTERS['ch' + d.ideasDay] ? String(d.ideasDay) : undefined,
      items: clean(d && d.items) })),
    someday: clean(raw.someday), places };

  dec(s) { const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }

    d: t.days.map(d => [d.title || '', d.note || '', d.chapter || 0, d.ideasDay || 0, ids(d.items)]),
    s: ids(t.someday), p: t.places.map(p => [p.id, p.name, r5(p.lat), r5(p.lng), p.note || '']) }));

  return { name: o.n, someday: items(o.s),
    days: o.d.map(d => ({ title: d[0], note: d[1], chapter: d[2] || undefined, ideasDay: d[3] || undefined, items: items(d[4]) })),
    places: (Array.isArray(o.p) ? o.p : []).map(p => ({ id: p[0], name: p[1], lat: p[2], lng: p[3], note: p[4] })) };
}

// Tile addresses exactly as the map asks for them, for the base map on screen (same server letter).
function tileUrl(z, x, y) {

  return d.url.replace('{s}', subs[Math.abs(x + y) % subs.length]).replace('{z}', z).replace('{x}', x).replace('{y}', y).replace('{r}', '');
}

function tilesInBounds(bounds, z) {

  const se = map.project(bounds.getSouthEast(), z).divideBy(256).floor();
  const out = [];
  for (let x = nw.x; x <= se.x; x++) for (let y = nw.y; y <= se.y; y++) out.push(tileUrl(z, x, y));
  return out;
}
function tilesAround(ll, z, r) {

  const out = [];
  for (let x = c.x - r; x <= c.x + r; x++) for (let y = c.y - r; y <= c.y + r; y++) out.push(tileUrl(z, x, y));

}

  if (!pts.length) return [];
  const urls = new Set();
  const b = L.latLngBounds(pts.map(s => [s.lat, s.lng])).pad(0.1);
  for (let z = 9; z <= 11; z++) tilesInBounds(b, nativeZoom(z)).forEach(u => urls.add(u));      // the whole route
  pts.forEach(s => { tilesAround(s, nativeZoom(13), 1).forEach(u => urls.add(u)); tilesAround(s, nativeZoom(15), 1).forEach(u => urls.add(u)); });  // around each stop

// A trip across a whole country (kit 1.12.0) is too big for the map-box approach above. Instead save,
// in order until the limit: each stop up close, a corridor along each day's route, an overview of
// the whole trip, then a closer look around each stop.
function wideTripTileUrls(t, pts) {

    () => { const b = L.latLngBounds(pts.map(s => [s.lat, s.lng])).pad(0.05); return [7, 8].flatMap(z => tilesInBounds(b, nativeZoom(z))); },

async function saveTiles(urls, what) {
  if (!offline.supported) { toast('Saving maps needs the hosted planner.'); return; }
  if (!navigator.serviceWorker.controller) { toast('Offline mode is still getting ready. Try again in a moment.'); return; }
  if (urls.length > MAX_SAVE) { toast(`That's ${urls.length.toLocaleString()} map tiles, more than ${MAX_SAVE.toLocaleString()} at once. Zoom in, or save part of the trip.`); return; }
  offline.busy = true; offline.done = 0; offline.total = urls.length; offline.failed = 0; renderOffline();
  await swAsk({ type: 'CACHE_TILES', urls }, m => {
    if (m.type === 'PROGRESS' || m.type === 'DONE') { offline.done = m.done; offline.total = m.total; offline.failed = m.failed; }
    const bar = $('#offline-area .progress > div'), lab = $('#off-label');
    if (bar) bar.style.width = (m.total ? Math.round(100 * m.done / m.total) : 100) + '%';
    if (lab && m.type === 'PROGRESS') lab.textContent = `Saving map tiles: ${m.done} of ${m.total}`;
  });
  offline.busy = false;
  toast(offline.failed ? `Saved ${what}, except ${offline.failed} tiles that couldn't be reached` : `Saved ${what} for offline use`);
  refreshOfflineStatus();
}
async function saveTripMaps() {
  const t = trip(); if (!t || !tripCount(t)) { toast('Add places to a trip first, then save its maps.'); return; }
  await saveTiles(tripTileUrls(t), `${baseDef().label.toLowerCase()} maps for your trip`);
  saveTripPhotos(t);
}
// The trip's photos: look up any not seen yet, then have the service worker keep the images.
async function saveTripPhotos(t) {
  if (!offline.supported || !navigator.serviceWorker.controller) return;
  const pts = [...t.days.flatMap(d => d.items), ...t.someday].map(i => S(i.stop)).filter(s => s && s.wiki);
  if (!pts.length) return;
  const metas = await Promise.all(pts.map(ensurePhoto));
  const urls = metas.filter(m => m && m.src).map(m => m.src);
  if (!urls.length) return;
  const res = await swAsk({ type: 'CACHE_PHOTOS', urls });
  const n = res && typeof res.saved === 'number' ? res.saved : urls.length;
  toast(`Saved ${n} ${n === 1 ? 'photo' : 'photos'} for your trip`);
}
function saveScreenMap() {
  const z = map.getZoom();
  if (z < 10) { toast('Zoom in to the area you want first: this view is too wide to save.'); return; }
  const urls = new Set(); for (let k = z; k <= Math.min(z + 2, 16); k++) tilesInBounds(map.getBounds(), nativeZoom(k)).forEach(u => urls.add(u));
  saveTiles([...urls], 'this map area');
}
async function clearMaps() {
  if (!confirm('Clear all saved maps from this device? Your trips are not affected.')) return;
  await swAsk({ type: 'CLEAR_TILES' }); offline.total = 0; toast('Saved maps cleared'); refreshOfflineStatus();
}
if (offline.supported) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
    const go = () => swAsk({ type: 'CACHE_PAGE' }).then(refreshOfflineStatus);
    if (navigator.serviceWorker.controller) go();
    else navigator.serviceWorker.addEventListener('controllerchange', go, { once: true });
  }).catch(() => { offline.supported = false; renderOffline(); });
}
window.addEventListener('offline', () => toast("You're offline. Your trips, place cards, and saved maps still work."));
window.addEventListener('online', () => toast('Back online'));

      <li>${GUIDE ? 'The Guide has tours by theme and by region. Open one to show its places on the map, check the ones you want, and add them as a day in your trip.' : 'Each chapter in the Guide can show its places on the map or become a day in your trip.'}</li></ul></div></details>

$('#btn-help').addEventListener('click', () => showTab('help'));

// ---------- tabs and the phone sheet ----------
const panel = $('#panel');
function showTab(tab) {
  if (isWide() && tab === 'map') tab = 'explore';
  ui.tab = tab;
  $$('[role="tab"]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab || (tab === 'explore' && b.dataset.tab === 'map' && !isWide()))));
  if (tab === 'map') { closePanel(); return; }
  if (!isWide()) closeCard();
  $$('.section').forEach(s => s.classList.toggle('active', s.id === 'sec-' + tab));
  if (tab === 'guide') renderGuide();
  if (tab === 'help') renderHelp();
  if (tab === 'more') { renderMore(); refreshOfflineStatus(); }
  if (tab === 'trip') renderTrip();
  if (!isWide()) { panel.classList.add('open'); panel.classList.toggle('full', tab === 'guide' || tab === 'help'); }
  $('#panel-body').scrollTop = 0;
}
function closePanel() {
  if (isWide()) return;
  panel.classList.remove('open', 'full');
  $$('.tabbar [role="tab"]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === 'map')));
  ui.tab = 'map';
}
$$('[role="tab"]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
$('#btn-filters').addEventListener('click', () => showTab('explore'));
$('#btn-filters-top').addEventListener('click', () => { showTab('explore'); setTimeout(() => $('#search').focus(), 300); });
// Sheet handle: tap toggles half and full; swipe up for full, down for half or closed.
(() => {
  const h = $('#panel-handle'); let y0 = null;
  h.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true });
  h.addEventListener('touchmove', e => { if (y0 !== null) e.preventDefault(); }, { passive: false });
  h.addEventListener('touchend', e => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0; y0 = null;
    if (dy > 50) { if (panel.classList.contains('full')) panel.classList.remove('full'); else closePanel(); }
    else if (dy < -50) panel.classList.add('full');
    else panel.classList.toggle('full');
  });
  h.addEventListener('click', e => { if (e.pointerType === 'mouse' || e.detail === 0) panel.classList.toggle('full'); });
})();
window.addEventListener('resize', () => { map.invalidateSize(); });

function refreshAll() {
  renderTrip(); renderResults(); renderMap();
  if (ui.selected) renderCard();
  if (ui.tour) { const y = $('#panel-body').scrollTop; renderGuide(); $('#panel-body').scrollTop = y; }
  $('#trip-label').textContent = trip() ? trip().name : '';
}

// ---------- start ----------
readShareLink();
renderExplore(); renderGuide(); renderMore(); renderTrip(); renderMap();
showTab(ui.shared ? 'trip' : (isWide() ? 'explore' : 'map'));
window.TripPlanner = { ui, CONFIG, makePlan, routeOrder, nearbyOf, planFrom, pathMi, setBaseLayer, allStopIds: () => STOPS.map(s => s.id), get store() { return store; }, openCard, addToDay, showTab, renderMap, refreshAll, encodeTrip, decodeTrip, onFix, addPlaceAt, tripTileUrls, tileUrl, offline };  // for tests
})();
