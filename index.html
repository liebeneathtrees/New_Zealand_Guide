he colony, and one tour adds Fort Taiaroa and its restored 1886 Armstrong disappearing gun. Open daily from 10:15am until dusk with tours roughly hourly from about 11am; book early in summer.","url":"https://albatross.org.nz/","lat":-45.7715,"lng":170.7299,"trail":null,"difficulty":null,"verify":true,"day":"5","distance":null,"north":false,"quick":false,"gem":false,"kids":true,"hike":true,"south":true,"best":[1,2,11,12],"bestSet":true,"seasonNote":"Adults nest November to January and chicks hatch mid January to mid February; chicks leave in September and none nest in October, so sightings are not guaranteed then.","wiki":"Taiaroa_Head"},{"id":"pilotsbeach","name":"Pilots Beach (Takiharuru) Blue Penguins","place":"Otago Peninsula, Taiaroa Head","cat":"wildlife","detail":"Pilots Beach, just inside the harbour entrance below Taiaroa Head, has the largest remaining little blue penguin colony on the Otago Peninsula. Penguins come ashore just after dusk, and Blue Penguins Pukekura runs guided evening tours from the Royal Albatross Centre. A free viewing platform 5 minutes' walk from the centre is open from 10:15am until 90 minutes before sunset, but penguins are hard to see by day.","url":"https://bluepenguins.co.nz/","lat":-45.7734,"lng":170.7228,"trail":null,"difficulty":null,"verify":true,"day":"5","distance":null,"north":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":true},{"id":"theOpera","name":"The OPERA Penguin Reserve","place":"Otago Peninsula, Harington Point","cat":"wildlife","detail":"The Otago Peninsula Eco Restoration Alliance runs guided tours on its private reserve at 45 Pakihau Road, Harington Point. Guides lead you about 2 km on foot through covered trenches to hides overlooking yellow-eyed penguin breeding areas, with a rehabilitation centre visit and a chance to see fur seals and sea lions. Bookings are strongly encouraged; contact them for tour times.","url":"https://theopera.co.nz/","lat":-45.8552,"lng":170.674,"trail":null,"difficu h":false,"quick":false,"gem":true,"hike":false,"south":true},{"id":"curiobaypenguins","name":"Curio Bay Penguin Walk and Petrified Forest","place":"Catlins, Curio Bay","cat":"wildlife","detail":"A short sealed track from the Curio Bay carpark and café leads to a viewing platform over a 180 million year old petrified forest, where a yellow-eyed penguin colony nests. Penguins head to sea early in the morning and return in the late afternoon or early evening, and they spook easily, so keep well back and keep dogs away. Neighbouring Porpoise Bay is home to Hector's dolphins.","url":"https://www.doc.govt.nz/parks-and-recreation/places-to-go/southland/places/curio-bay-porpoise-bay/things-to-do/penguin-walk/","lat":-46.6623444,"lng":169.0979222,"trail":"20 minutes return","difficulty":"Easiest, wheelchair and buggy accessible to the platform","verify":false,"day":"4","distance":null,"north":false,"quick":true,"gem":false,"kids":true,"hike":true,"south":true,"seasonNote":"Penguins return from the sea in the late afternoon or early evening."},{"id":"catlinsinnatm","name":"Catlins Inn Bar & Bistro","place":"Catlins, Owaka","cat":"food","detail":"A country hotel bar and bistro one block from Owaka's main street, with Ryley's Cafe serving country bistro fare at affordable prices. It also has a bottle store, studio units and a campervan park at the rear with powered sites on enquiry. Meal times are not published, so phone 03 415 8350 ahead.","url":null,"lat":-46.4525,"lng":169.659,"trail":null,"difficulty":null,"verify":true,"day":"3","distance":null,"north":false,"indoor":true,"quick":false,"gem":false,"kids":true,"hike":false,"south":true},{"id":"kakapoints","name":"The Point Cafe & Bar","place":"Catlins, Kaka Point","cat":"grocery","detail":"Cafe and bar at 58 Esplanade overlooking the Pacific, serving blue cod and seafood platters, open Tuesday to Sunday for lunch and dinner per the Catlins Coast map (Oct 2024).","url":null,"lat":-46.3861,"lng":169.7826,"trail":null,"difficu ":true,"quick":false,"gem":false,"kids":true,"hike":false,"south":true},{"id":"tunnelbeach","name":"Tunnel Beach Walk","place":"Dunedin, south coast near St Clair","cat":"hikes","detail":"A walk to sandstone cliffs and a hidden cove reached through a tunnel commissioned in the 1870s by settler John Cargill and dug by hand. The descent is steep with steps and the return is all uphill; bring a torch for the dark tunnel and avoid the beach at high tide. The car park is open 8am to 9pm from September to March and 9am to 5pm from April to August.","url":"https://www.doc.govt.nz/parks-and-recreation/places-to-go/otago/places/dunedin-area/things-to-do/tunnel-beach-walk/","lat":-45.9148,"lng":170.4709,"trail":"2.6 km return, about 1 hour (viewpoint 600 m return, 10 minutes)","difficulty":"Steep descent and climb back","verify":true,"day":"5","distance":null,"north":false,"quick":false,"gem":true,"kids":true,"hike":true,"south":true,"seasonNote":"Car park hours: 8am to 9pm Sep to Mar, 9am to 5pm Apr to Aug."},{"id":"stclairbeach","name":"St Clair Beach and Hot Salt Water Pool","place":"Dunedin, St Clair","cat":"wellness","detail":"An outdoor heated salt water pool at the southern end of St Clair Beach, with six lanes, a toddlers pool and a café. In 2022 the season ran from 1 October to 31 March with water heated to 28°C. It is not a year-round pool, so check this season's hours with Dunedin City Council.","url":"https://www.dunedin.govt.nz/community-facilities/swimming-pools/st-clair-pool","lat":-45.9065,"lng":170.4939,"trail":null,"difficulty":null,"verify":true,"day":"5","distance":null,"north":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":true,"closedMonths":[4,5,6,7,8,9],"best":[1,2,3,10,11,12],"bestSet":true,"seasonNote":"Seasonal: about 1 October to 31 March (2022 season dates)."},{"id":"highcliffroad","name":"Highcliff Road","place":"Otago Peninsula, Dunedin","cat":"outdoors","detail":"The upper road along the Otago Peninsula, climbing to 290 m abov ot at the head of Lake Wakatipu. The Glenorchy Walkway starts from the waterfront: a 4.4 km boardwalk loop of 1 to 2 hours across wetlands with views of Mt Earnslaw and Mt Alfred. The lagoon section floods in heavy rain.","url":null,"lat":-44.853,"lng":168.386,"trail":"Glenorchy Walkway: 4.4 km loop, 1 to 2 hours","difficulty":"Easy, family friendly","verify":false,"day":"9","distance":null,"north":false,"quick":true,"gem":true,"kids":true,"hike":true,"south":true},{"id":"paradisevly","name":"Paradise Valley","place":"Glenorchy, 20 km north","cat":"outdoors","detail":"A valley about 20 km from Glenorchy near Diamond Lake whose scenery appeared in The Lord of the Rings, with Isengard and Lothlorien among the filming locations named for the area. The road runs north of Glenorchy toward the Dart and Rees valleys.","url":"https://www.queenstownnz.co.nz/stories/post/eight-of-the-best-things-to-do-in-glenorchy/","lat":-44.7239,"lng":168.3723,"trail":null,"difficulty":null,"verify":true,"day":"9","distance":null,"north":false,"quick":false,"gem":true,"kids":true,"hike":true,"south":true},{"id":"lakesylvan","name":"Lake Sylvan Track","place":"Glenorchy, Routeburn Road","cat":"hikes","detail":"An easy walk through tall red beech forest and old river terraces to a viewing platform over Lake Sylvan, with views to Mt Earnslaw/Pikirakatahi. It is about 40 minutes to the platform, and you can return on a loop along a 1920s tramline. The car park is about 30 minutes from Glenorchy on a gravel road.","url":"https://www.doc.govt.nz/parks-and-recreation/places-to-go/otago/places/mount-aspiring-national-park/things-to-do/tracks/lake-sylvan-track/","lat":-44.725,"lng":168.3145,"trail":"5.3 km return loop, about 1 hour 40 minutes","difficulty":"Easy","verify":false,"day":"9","distance":null,"north":false,"quick":false,"gem":true,"kids":true,"hike":true,"south":true},{"id":"dartriverjet","name":"Dart River Adventures","place":"Glenorchy, 45 Mull Street","cat":"outdoors","detail":"Jet boat and inflatable canoe (Funyak) trips up the glacier-fed Dart River from Glenorchy, run by Ngāi Tahu Tourism. The Wilderness Jet is a half-day trip; the Funyaks experience is a full day with jet boat, paddling, lunch and transfers from Queenstown. Book ahead online or on 0800 327 853.","url":"https://www.dartriver.co.nz/","lat":-44.8493,"lng":168.3859,"trail":null,"difficulty":null,"verify":true,"day":"9","distance":null,"north":false,"quick":false,"gem":false,"hike":false,"south":true},{"id":"invinciblemine","name":"Invincible Mine Track","place":"Glenorchy, Rees Valley","cat":"hikes","detail":"A miners' track from the 1800s climbing through beech forest and mānuka to a lookout over the Rees Valley and Mt Earnslaw/Pikirakatahi. Historic remains include a water wheel and seven Berdan pans; stay off the equipment and behind the mesh barrier at the deep shaft. The start is on Rees Valley Road, 30 minutes from Glenorchy on gravel with fords, and the track crosses private land.","url":null,"lat":-44.7247,"lng":168.47,"trail":"4.6 km return, 3 hours","difficulty":"Steady climb","verify":true,"day":"9","distance":null,"north":false,"quick":false,"gem":true,"hike":true,"south":true},{"id":"lakereiddiamond","name":"Diamond Creek Walk to Lake Reid","place":"Glenorchy, Routeburn Road","cat":"hikes","detail":"A walk along Diamond Creek, a popular trout fishing spot, to Lake Reid with its waterfowl and views of the Paradise area and Dart valley. The start is on Glenorchy-Routeburn Road, about 15 minutes from Glenorchy. Dogs are allowed.","url":"https://doc.govt.nz/parks-and-recreation/places-to-go/otago/places/glenorchy-area/things-to-do/diamond-creek-track","lat":-44.768,"lng":168.358,"trail":"2.7 km one way, 45 minutes","difficulty":null,"verify":false,"day":"9","distance":null,"north":false,"quick":false,"gem":true,"kids":true,"hike":true,"south":true},{"id":"highctryhorses","name":"High Country Horses","place":"Glenorchy, Priory Road","cat":"outdoors","detail":"Horse trekking company based at 243 Priory Road, Glenorchy, with rides from 1 hour to multi-day trips in the Rees and Dart valleys. The 1 hour Ride of the Rings in Paradise is walk-only and suits beginners, while the 2 hour Rees River Trail suits all abilities. Book ahead: prices listed in 2026 run from 180 NZD (1 hour) to 300 NZD (2 hour Rees River Trail), and the Paradise ride leaves from a second yard reached by gravel road.","url":"https://highcountryhorses.nz/","lat":-44.7995,"lng":168.3778,"trail":null,"difficulty":null,"verify":true,"day":"9","distance":null,"north":false,"indoor":false,"quick":false,"gem":true,"hike":false,"south":true},{"id":"pigeoniskayak","name":"Rippled Earth Kayaking: Glenorchy Island Safari","place":"Glenorchy, Lake Wakatipu","cat":"wildlife","detail":"Small Glenorchy kayak company running a half-day guided paddle to Pig and Pigeon Island, a reserve in Lake Wakatipu, with a short guided walk through the island's beech forest. Trips include transfer from Queenstown, all kayak gear and refreshments. Listed as running daily at 8am and 1pm from November to April, about 4.5 hours return from Queenstown, 135 NZD, minimum age 8.","url":"https://rippledearth.nz/","lat":-44.9238,"lng":168.3966,"trail":null,"difficulty":null,"verify":true,"day":"9","distance":null,"north":false,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":true,"closedMonths":[5,6,7,8,9,10],"best":[1,2,3,4,11,12],"bestSet":true,"seasonNote":"Bookme listing: daily departures in summer, November to April."},{"id":"twelvemiledelta","name":"Twelve Mile Delta","place":"Glenorchy Road, 12 km west of Queenstown","cat":"outdoors","detail":"DOC campsite on the river delta where Twelve Mile Creek meets Lake Wakatipu, used as the Ithilien Camp location in the Lord of the Rings films. Tracks start nearby, including the Twelve Mile to Bob's Cove Track and the Mt Crichton Loop Track. Camping is 15 NZD per adult per night with no booking needed, and DOC advises not camping under the trees.","url":"https://doc.govt.nz/parks-and-recreation/places-to-go/otago/places/queenstown-area/things-to-do/twelve-mile-delta-campsite","lat":-45.0672,"lng":168.5459,"trail":null,"difficulty":null,"verify":false,"day":"9","distance":null,"north":false,"indoor":false,"quick":true,"gem":true,"kids":true,"hike":true,"south":true},{"id":"mavoralakes","name":"Mavora Lakes","place":"Southland, off SH94 between Mossburn and Te Anau","cat":"outdoors","detail":"Two lakes in Mavora Lakes Conservation Park with DOC camping beside South Mavora Lake and between the two lakes. North Mavora Lake was the filming location for Nen Hithoel in the Lord of the Rings films, and the area is known for walking, mountain biking, trout fishing and robins and falcons. Access is 39 km of gravel from SH94 (about 1.5 hours from Te Anau), camping is 10 NZD per adult and must be booked, and there are no rubbish bins.","url":"https://dxcprod.doc.govt.nz/parks-and-recreation/places-to-go/southland/places/mavora-lakes-conservation-park/things-to-do/mavora-lakes-campsite","lat":-45.268,"lng":168.175,"trail":null,"difficulty":null,"verify":true,"day":null,"distance":null,"north":false,"indoor":false,"quick":false,"gem":true,"kids":true,"hike":true,"south":true,"seasonNote":"Book early for 1 December to 28 February; summer fire bans apply."},{"id":"glacierburntrack","name":"Glacier Burn Track","place":"Kinloch Road, 25 min from Glenorchy","cat":"hikes","detail":"Steep DOC track that follows a creek then climbs through beech forest to Glacier Basin, with the option of following the creek further for views of the Humboldt Mountains. DOC notes great bird life and old saw-milling lines near the start. Allow 2 to 4 hours; it is signposted from the Glenorchy to Kinloch road.","url":"https://www.doc.govt.nz/parks-and-recreation/places-to-go/otago/places/glenorchy-area/things-to-do/glacier-burn-track/","lat":-44.8189,"lng":168.3476,"trail":"2 to 4 hours; Glacier Basin after about 2 hours","difficulty":"Advanced","verify":true,"day":"10","distance":null,"north":false,"indoor":false,"quick":false,"gem":true,"kids":false,"hike":true,"south":true,"seasonNote":"DOC: do not go above the bush line in winter and spring, the area is prone to avalanches."},{"id":"robroyglacier","name":"Rob Roy Track","place":"Wānaka, West Matukituki Valley","cat":"hikes","detail":"DOC track from the Raspberry Creek car park that crosses a swing bridge over the West Matukituki River, climbs through beech forest and ends at lookouts facing Rob Roy Glacier, with waterfalls and cliffs; kea are often seen. It is graded easy and DOC says older children can do it. The car park is 54 km from Wānaka (last 30 km gravel with fords that can be impassable after heavy rain), and in avalanche season, May to November, DOC strongly recommends stopping at the lower lookout.","url":"https://www.doc.govt.nz/parks-and-recreation/places-to-go/otago/places/mount-aspiring-national-park/things-to-do/tracks/rob-roy-track/","lat":-44.5104,"lng":168.7434,"trail":"3 to 4 hours return","difficulty":"Easy","verify":true,"day":"10","distance":null,"north":false,"indoor":false,"quick":false,"gem":true,"kids":true,"hike":true,"south":true,"seasonNote":"Avalanche paths active May to November between the lower and upper lookouts; shaded sections icy in winter and early spring."},{"id":"skipperscyn","name":"Skippers Canyon","place":"Queenstown, north via Coronet Peak road","cat":"history","detail":"Gold-rush gorge about 22 km long, carved by the Shotover River, reached on the narrow, unsealed Skippers Road built from 1883 to 1890 and protected by Heritage New Zealand. Sights include the restored Skippers School and cemetery at Skippers Point and the 1901 Skippers Suspension Bridge about 100 m above the river. Rental car companies do not allow their vehicles on the road, so go with a local tour operator; the bridge has been closed to vehicles and walkers since January 2026 until further notice.","url":"https://www.newzealand.com/au/feature/skippers-road/","lat":-44.9165,"lng":168.58,"trail":null,"difficulty":null,"verify":true,"day":"10","distance":null,"north":false,"indoor":false,"quick":false,"gem":true,"hike":false,"south":true,"seasonNote":"Skippers Bridge closed to vehicles, cyclists and pedestrians from 12 January 2026 until further notice (broken suspension cable wires)."},{"id":"bridalveilfalls","name":"Bridal Veil Falls, Routeburn Track","place":"Routeburn Track, Glenorchy end","cat":"falls","detail":"Waterfall on the first section of the Routeburn Track, where the track climbs to Bridal Veil Waterfall and continues above the gorge toward Routeburn Flats. It makes a shorter turnaround point for a day walk from Routeburn Shelter. The full section from Routeburn Shelter to Routeburn Flats Hut is 7.5 km one way, 1.5 to 2.5 hours.","url":"https://www.doc.govt.nz/parks-and-recreation/places-to-go/fiordland/places/fiordland-national-park/things-to-do/tracks/routeburn-track/description","lat":-44.7007,"lng":168.2485,"trail":"Before Routeburn Flats (Shelter to Flats 7.5 km one way, 1.5 to 2.5 hr)","difficulty":null,"verify":true,"day":"9","distance":null,"north":false,"indoor":false,"quick":false,"gem":false,"hike":true,"south":true},{"id":"routeburnflats","name":"Routeburn Flats","place":"Routeburn Track, Glenorchy end","cat":"hikes","detail":"Day walk from Routeburn Shelter on the Routeburn Road to the open grassed flats, crossing a swing bridge to Routeburn Flats Hut and campsite. It is 7.5 km one way, 1.5 to 2.5 hours, so allow about 3 to 5 hours return. Overnight stays need a booking in the Great Walks season, 1 November to 30 April.","url":"https://doc.govt.nz/parks-and-recreation/places-to-go/otago/places/mount-aspiring-national-park/things-to-do/huts/routeburn-flats-hut/","lat":-44.7255,"lng":168.2153,"trail":"15 km return, 3 to 5 hours","difficulty":null,"verify":true,"day":"9","distance":null,"north":false,"indoor":false,"quick":false,"gem":false,"hike":true,"south":true,"seas rienced only","verify":true,"day":"9","distance":null,"north":false,"indoor":false,"quick":false,"gem":true,"kids":false,"hike":true,"south":true},{"id":"reesdarttrhd","name":"Rees-Dart Track, Muddy Creek","place":"Rees Valley, 68 km from Queenstown","cat":"hikes","detail":"Muddy Creek car park is the start of the Rees side of the Rees-Dart Track, an advanced 4 to 5 day tramp crossing Rees Saddle at 1471 m. The Dart Track is closed indefinitely by a large slip, so the full circuit is impassable: options are Muddy Creek to Dart Hut and back, or a pre-booked helicopter transfer. Takahē were released into the Rees Valley in February 2025, and the track is impassable to all but experienced mountaineers from May to October.","url":"https://www.doc.govt.nz/parks-and-recreation/places-to-go/otago/places/mount-aspiring-national-park/things-to-do/tracks/rees-dart-track/","lat":-44.696,"lng":168.4701,"trail":"Muddy Creek to Dart Hut about 29 km one way","difficulty":"Advanced","verify":true,"day":"9","distance":null,"north":false,"indoor":false,"quick":false,"gem":true,"kids":false,"hike":true,"south":true,"closedMonths":[5,6,7,8,9,10],"seasonNote":"Impassable to all but experienced mountaineers May to October; avalanche paths active May to November; upper Snowy Creek bridge removed each winter, maybe until December."},{"id":"keysummit","name":"Key Summit Track","place":"The Divide, Milford Road, 85 km from Te Anau","cat":"hikes","detail":"From The Divide car park, follow the Routeburn Track for about an hour to the turnoff, then climb about 20 minutes to Key Summit. The top has alpine tarns and bogs and panoramic views over the Humboldt and Darran Mountains; tomtits, robins and bellbirds are common. Allow about 3 hours return and save it for a fine day.","url":"https://doc.govt.nz/parks-and-recreation/places-to-go/fiordland/places/fiordland-national-park/things-to-do/tracks/routeburn-track-key-summit-track","lat":-44.8131,"lng":168.1294,"trail":"About 3 hours return","diffic ail":"A 7 km return walk from Rangitoto Wharf over rough volcanic scoria and through pōhutukawa forest to the 259 m summit, with a 20 minute crater rim loop and a 15 minute side trip to the lava caves (bring a torch). Ferries take about 25 minutes from downtown Auckland; check the Fullers timetable and allow time to get back for your return sailing. There is no drinking water or rubbish bins on the island, a total fire ban applies, and gear should be checked and cleaned because the island is pest free.","url":"https://www.doc.govt.nz/parks-and-recreation/places-to-go/auckland/places/rangitoto-island/tracks/rangitoto-summit-track/","lat":-36.786742,"lng":174.860115,"trail":"7 km return, about 2 hours","difficulty":"Easy to intermediate","verify":true,"day":"11","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":true,"south":false},{"id":"tehengawalkway","name":"Te Henga Walkway (Muriwai to Tirikohua Point)","place":"Auckland, Bethells Beach to Muriwai","cat":"hikes","detail":"Cliff-top walk from Constable Road, Muriwai, down steps and along a farm valley to a coastal viewpoint (about 45 minutes) and on to Tirikohua Point (about 65 minutes). The section south to Bethells Beach has been closed since landslides in early 2023. No dogs or bikes; the track crosses private land.","url":null,"lat":-36.884194,"lng":174.450863,"trail":null,"difficulty":"Moderate (steep sections)","verify":true,"day":"11","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":false,"hike":true,"south":false},{"id":"tanemahuta","name":"Tāne Mahuta Walk","place":"Northland, Waipoua Forest","cat":"hikes","detail":"A 5 minute boardwalk from State Highway 12 to Tāne Mahuta, New Zealand's largest known living kauri, with a 13.77 m trunk girth and 51.2 m total height. The track is wheelchair and buggy accessible, and the gate is open 9am to 4pm daily. Clean wheelchairs and shoes at the wash station and keep to the track to protect the kauri r akes","name":"Kai Iwi Lakes","place":"Northland, Kauri Coast near Dargaville","cat":"outdoors","detail":"Three clear freshwater dune lakes (Taharoa, Kai Iwi and Waikare) with white sand edges, about 35 km northwest of Dargaville. Swim, kayak, paddleboard, fish for trout or walk the track around Lake Taharoa. There are campsites, picnic areas and BBQs.","url":null,"lat":-35.79846,"lng":173.630455,"trail":null,"difficulty":null,"verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"matapouri","name":"Matapouri Beach and Whale Bay","place":"Northland, Tutukaka Coast","cat":"outdoors","detail":"A sheltered beach up the coast from Tutukaka, with Whale Bay nearby known for good surf. Tutukaka is the gateway to the Poor Knights Islands Marine Reserve.","url":null,"lat":-35.56236,"lng":174.51139,"trail":null,"difficulty":null,"verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"shakespearecliff","name":"Shakespeare Cliff Lookout","place":"Coromandel, Cooks Beach","cat":"outdoors","detail":"A coastal lookout near Lonely Bay, about 35 minutes from Whitianga, with views over Cooks Bay, Lonely Bay and nearby islands.","url":null,"lat":-36.83333,"lng":175.73333,"trail":null,"difficulty":null,"verify":true,"day":"12","distance":null,"north":true,"indoor":false,"quick":true,"gem":false,"kids":true,"hike":false,"south":false},{"id":"lostspring","name":"The Lost Spring","place":"Coromandel, Whitianga","cat":"wellness","detail":"Geothermal mineral pools set among tropical plants and waterfalls, with a day spa, at 121A Cook Drive in Whitianga. Under 14s are not allowed in the thermal pools and 14 to 17 year olds need an adult. Adult entry is listed at $75, and spa treatments must be booked ahead; the listing gives hours of 9am to 7pm Thursday and Sunday and 9am to 9pm Friday and Saturday.","url":"https://www.t wimming and kayaking off the beach. The Goat Island Discovery Centre is a good family and wet-weather option. Do not swim or snorkel in east or north-east winds over 20 knots or swells over 1 m, and nothing may be taken from the reserve.","url":"https://www.doc.govt.nz/goatisland","lat":-36.26667,"lng":174.8,"trail":null,"difficulty":null,"verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"muriwaigannets","name":"Muriwai Gannet Colony","place":"Auckland, Muriwai (Ōtakamiro Point)","cat":"wildlife","detail":"Takapu Refuge gannet colony on the cliffs at the southern end of Muriwai Beach, which Tourism NZ calls the most accessible gannet colony in New Zealand. Viewing points above the colony reopened in December 2024 after storm damage. Park at the Waitea Road car park; no dogs, and the gannets leave around March or April.","url":"https://ourauckland.aucklandcouncil.govt.nz/news/2024/12/gannet-track-reopens-at-muriwai-regional-park/","lat":-36.83189,"lng":174.42491,"trail":null,"difficulty":null,"verify":true,"day":"11","distance":null,"north":true,"indoor":false,"quick":true,"gem":false,"kids":true,"hike":false,"south":false,"seasonNote":"Colony can be seen until about March or April, when the gannets leave; council said the track may close temporarily for repairs after that. Maukatia Bay track access was closed on weekdays until mid-December 2025."},{"id":"kawiticaves","name":"Kawiti Glowworm Caves","place":"Northland, Waiomio near Kawakawa","cat":"wildlife","detail":"Guided tour through limestone caves lit by glowworms, with Māori legends shared along the way. Tours run about 45 minutes, hourly from 9am to 4pm at 49 Waiomio Road. Adults $50 and children $30 on Bookme; arrive at your exact booking time.","url":"https://www.kawiticaves.co.nz","lat":-35.409357,"lng":174.081448,"trail":null,"difficulty":null,"verify":true,"day":null,"distance":null,"north":true,"indoor":true,"quic trail follows the Te Wairoa Stream to a 30 m waterfall over the Waitoharuru cliffs. Open Wednesday to Sunday 10am to 4pm; $25 adult, under 13 free with a paying adult; the waterfall path has steep stairs.","url":"https://www.bookme.co.nz/things-to-do/rotorua-taupo/activity/the-buried-village-archaeological-site-and-museum-admission/1116","lat":-38.212887,"lng":176.363131,"trail":"Waterfall trail along Te Wairoa Stream; length not sourced","difficulty":"Steep stairs on waterfall section","verify":true,"day":"15","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false,"seasonNote":"Closed Monday and Tuesday.","wiki":"Te_Wairoa,_New_Zealand"},{"id":"tepatu","name":"Te Pā Tū","place":"Rotorua, Tumunui, State Highway 5","cat":"history","detail":"A 3.5 hour evening experience in a forest pā with bonfires, song and drama performances and stories, with seasonal content tied to the maramataka (Māori lunar calendar). Dinner includes a traditional hāngi and a Māori fusion feast. Check in at the booking office near the Rotorua i-SITE; the venue is a 12 km drive out; $280 adult, $115 child.","url":"https://te-pa-tu.com/","lat":-38.245059,"lng":176.310827,"trail":null,"difficulty":null,"verify":true,"day":"15","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"waikatomuseum","name":"Waikato Museum","place":"Hamilton, 1 Grantham Street","cat":"history","detail":"Te Whare Taonga o Waikato, the region's museum and art gallery, sits on the banks of the Waikato River and covers Waikato art, history, culture and science. General admission is free; the Exscite hands-on kids' space and some exhibitions charge. Open daily 10am to 5pm except Christmas Day.","url":"https://tewharetaonga.nz","lat":-37.790011,"lng":175.28595,"trail":null,"difficulty":null,"verify":false,"day":"13","distance":null,"north":true,"indoor":true,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"tepoorere","name":"Te Pōrere Redoubts","place":"Off SH47, west of Lake Rotoaira","cat":"history","detail":"Earthworks built by Te Kooti's followers in 1869, attacked on 4 October 1869 in the last major battle of the New Zealand Wars; 37 of the defenders are buried in the upper redoubt. The site is a historic reserve open to the public. A short path leads from a car park off State Highway 47.","url":"https://www.heritage.org.nz/the-list/details/7652","lat":-39.04639,"lng":175.58611,"trail":"Short path from SH47 car park; length not sourced","difficulty":null,"verify":false,"day":"17","distance":null,"north":true,"indoor":false,"quick":true,"gem":false,"kids":true,"hike":false,"south":false,"wiki":"Te_Pōrere_Redoubts"},{"id":"taupomuseum","name":"Taupō Museum","place":"Taupō, Story Place","cat":"history","detail":"Small council museum and art gallery in central Taupō, home to the Ora Garden of Wellbeing, which debuted at the Chelsea Flower Show in 2004; Love Taupō also notes a moa skeleton on display. Open daily 10am to 4.30pm except Christmas Day and Good Friday. Adults $6.50, under 18 free.","url":"https://www.taupodc.govt.nz/community/taupo-museum/location-and-hours","lat":-38.6873,"lng":176.0651,"trail":null,"difficulty":null,"verify":false,"day":"16","distance":null,"north":true,"indoor":true,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"raglan","name":"Raglan","place":"Raglan, Waikato west coast","cat":"towns","detail":"A laid-back surf town on the Waikato west coast with a creative community. Manu Bay is known for its long left-hand break, and Ngarunui Beach has surf schools for beginners. Kayaking among the limestone formations of the harbour is a quieter option.","url":"https://www.waikatonz.com/places-to-go/raglan/","lat":-37.801782,"lng":174.872904,"trail":null,"difficulty":null,"verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false,"wiki":"Raglan,_New_Zealand"},{"id":"ohakune","name":"Ohakune","place":"Ohakune, Ruapehu","cat":"towns","detail":"The carrot capital at the foot of Mt Ruapehu, with a 7.5 m carrot at the town's east end and the lively Junction end busiest in ski season. The Ohakune Old Coach Road, a grade 2 cycle trail of about 15 km one way, passes viaducts and tunnels. Tūroa ski area is a short shuttle ride up the mountain in winter.","url":"https://www.newzealand.com/us/ohakune/","lat":-39.417278,"lng":175.399323,"trail":null,"difficulty":null,"verify":false,"day":"17","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false,"seasonNote":"Junction bars busiest in winter ski season."},{"id":"matamata","name":"Matamata","place":"Matamata, Waikato","cat":"towns","detail":"Farm town best known as the base for the Hobbiton Movie Set, with more than 44 hobbit holes and a drink at the Green Dragon Inn on guided tours. Wairere Falls, a 153 m drop, is nearby with a track to a lookout. About 45 minutes from Hamilton and an hour from Rotorua.","url":"https://www.newzealand.com/ie/matamata/","lat":-37.808924,"lng":175.774268,"trail":null,"difficulty":null,"verify":false,"day":"13","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"taupotown","name":"Taupō","place":"Taupō, Lake Taupō","cat":"towns","detail":"Lakeside town on Lake Taupō, a huge volcanic caldera that last erupted in 181 AD. It is a base for trout fishing, lake cruises to the Mine Bay rock carvings, mountain biking, Huka Falls and hiking in Tongariro National Park. The town also has a growing food scene and a local market.","url":"https://www.lovetaupo.com/","lat":-38.685778,"lng":176.07007,"trail":null,"difficulty":null,"verify":false,"day":"16","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false,"wiki":"Taupō"},{"id":"okerefallsstore","name":"Okere Falls Store","place":"Rotorua, Okere Falls, SH33","cat":"food","detail":"Country store and craft beer garden at 757A State Highway 33, handy after the Okere Falls walk. Neat Places recommends the smoked kahawai toast on local rye sourdough, with a gluten-free option. Mapcarta lists hours as 7am to 4pm Sunday to Wednesday and 7am to 8pm Thursday to Saturday.","url":null,"lat":-38.018028,"lng":176.343217,"trail":null,"difficulty":null,"verify":true,"day":"15","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"hukaprawnpark","name":"Huka Prawn Park","place":"Taupō, Wairakei, 201 Karetoto Road","cat":"food","detail":"Riverside Restaurant on the Waikato River plus a family activity park with a prawn nursery and hatchery tour, paddleboards, water trikes, pedal boats and geothermal footbaths. Prawn fishing is currently unavailable while the operator rebuilds prawn stocks. Activity park open weekends 9am to 3pm and restaurant Friday to Tuesday 9am to 3pm; $27.50 adult, $15 child.","url":"https://hukaprawnpark.co.nz","lat":-38.628689,"lng":176.095944,"trail":null,"difficulty":null,"verify":true,"day":"16","distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"zealong","name":"Zealong Tea Estate","place":"Hamilton, 495 Gordonton Road","cat":"food","detail":"Organic tea estate, described in its listing as NZ's only commercial tea estate, with a Tea Room serving a signature high tea or a seasonal lunch. You can add a tea tasting ceremony or a guided plantation tour. Book ahead; a $25 per guest minimum applies at peak times.","url":"https://zealong.com/tea-room/","lat":-37.706461,"lng":175.294087,"trail":null,"difficulty":null,"verify":true,"day":"13","distance":null,"north":true,"indoor":true,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"volcanichills","name":"Volcanic Hills Winery","place":"Rotorua, Skyline gondola, Fairy Springs Road","cat":"drinks","detail":"Tasting room at the top of the Skyline Rotorua gondola with views over Lake Rotorua, pouring wines made from grapes sourced around New Zealand, with sharing platters. Tastings cost $19 to $25 and do not include the gondola ride. Open 11am to 5pm Monday to Wednesday and 11am to 6pm Thursday to Sunday; arrive 45 minutes before close for the 5-wine tasting.","url":"https://www.volcanichills.co.nz","lat":-38.11009,"lng":176.223132,"trail":null,"difficulty":null,"verify":true,"day":"15","distance":null,"north":true,"indoor":true,"quick":false,"gem":false,"kids":false,"hike":false,"south":false,"seasonNote":"Closed Christmas Day, Good Friday and Easter Sunday."},{"id":"goodgeorge","name":"Good George Brewing","place":"Hamilton, 32A Somerset Street, Frankton","cat":"brewery","detail":"Brewery and distillery in the former St George's Church, where tours cover the brewery's story, the working brewhouse and a tasting. Tours run Thursday and Friday at 4.30pm and weekends at 11am and 3pm, from $35.","url":"https://dininghall.co.nz/pages/brewery-tours","lat":-37.788515,"lng":175.269224,"trail":null,"difficulty":null,"verify":true,"day":"13","distance":null,"north":true,"indoor":true,"quick":false,"gem":false,"kids":false,"hike":false,"south":false},{"id":"craftytrout","name":"Crafty Trout Brewery","place":"Taupō, 135 Tongariro Street","cat":"brewery","detail":"Town-centre brewery with an upstairs Bier Kafe pouring 14 beers and ciders with pizzas and pretzels, plus a downstairs shop. Brewery tours take 1 to 1.5 hours, cost $40 and include a four-beer tasting rack (18+). Bier Kafe listed as noon to 10pm Wednesday to Monday, but the business is advertised for sale and another listing says it trades 4 days a week, so check hours.","url":"https://www.craftytrout.co.nz","lat":-38.684753,"lng":176.070547,"trail":null,"difficulty":null,"verify":true,"day":"16","distance":null,"north":true,"indoor":true,"quick":false,"gem":false,"kids":false,"hike":false,"south":false,"seasonNote":"Listing shows no operation in May."},{"id":"hukalodge","name":"Huka Lodge","place":"Taupō, 271 Huka Falls Road","cat":"stay","detail":"Luxury lodge on 17 acres of gardens beside the Waikato River near Huka Falls, which reopened on 1 March 2025 after a refurbishment costing about NZ$25 million. The redesign added a wellness centre, a riverside terrace and refreshed suites. Rates are listed at $3,200 to $18,000 per night.","url":"https://hukalodge.com/","lat":-38.65513,"lng":176.085483,"trail":null,"difficulty":null,"verify":true,"day":"16","distance":null,"north":true,"quick":false,"gem":false,"hike":false,"south":false},{"id":"hiltontaupo","name":"Hilton Lake Taupō","place":"Taupō, Napier Road (Hilltop)","cat":"stay","detail":"Hotel above town with 113 rooms, suites and apartments; some Heritage Wing rooms look over Lake Taupō and the Onekeneke Thermal Valley. Guests get free use of a thermally heated outdoor pool, hot tub, gym and tennis courts. Bistro Lago, the on-site restaurant, is at 80-100 Napier Road.","url":null,"lat":-38.7038493,"lng":176.0996623,"trail":null,"difficulty":null,"verify":false,"day":"16","distance":null,"north":true,"gem":false,"hike":false,"south":false},{"id":"treetops","name":"Treetops Lodge and Estate","place":"Rotorua, rural estate","cat":"stay","detail":"Luxury lodge set within 2,500 acres of native forest, with suites and villas looking across the estate. Guided nature walks and spa treatments are offered, and the farm-to-table restaurant uses local ingredients, some grown on site.","url":"https://www.rotoruanz.com/accommodation/luxury-lodges/treetops-lodge-estate","lat":-38.2174579,"lng":176.1594225,"trail":null,"difficulty":null,"verify":true,"day":"15","distance":null,"north":true,"gem":false,"hike":false,"south":false},{"id":"regentrotorua","name":"Regent of Rotorua","place":"Rotorua, city centre","cat":"stay","detail":"Contemporary boutique hotel in town, within walking distance of many of Rotorua's bars 30am to 5.30pm in winter; no dogs.","url":"https://westernbay.govt.nz/recreation/walking-tracks-and-trails/mclaren-falls","lat":-37.80579,"lng":176.04502,"trail":"Short, easy stroll to the waterfall; part of it wheelchair and mobility scooter friendly","difficulty":"Easy","verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":true,"gem":false,"kids":true,"hike":false,"south":false},{"id":"omanawafalls","name":"Te Rere o Ōmanawa (Ōmanawa Falls)","place":"Bay of Plenty, Ōmanawa near Tauranga","cat":"falls","detail":"Council reserve at 1031 Ōmanawa Road with a forest walkway linking the car park to three lookout platforms over the falls. Choose a 40 minute or a harder 1 hour 20 minute return walk; the section between Wairere Tapu and Te Harikoa lookouts has several hundred stairs. No swimming or access to the water, as the site is sacred to Ngāti Hangarau; open 8am to 7.30pm in daylight saving and 8am to 5.30pm in winter.","url":"https://www.tauranga.govt.nz/Parks-and-recreation/Parks/Te-Rere-o-Omanawa-Omanawa-Falls","lat":-37.84318,"lng":176.08239,"trail":"40 min return, or 1 hr 20 min return","difficulty":"Moderate to high fitness for the stair section","verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"hike":false,"south":false},{"id":"rerefalls","name":"Rere Falls","place":"Gisborne, Rere (Wharekōpae Road)","cat":"falls","detail":"A waterfall on the Wharekōpae River among farmland, about 45 minutes' drive from Gisborne via Wharekōpae Road. The falls are a one minute walk from a car park with toilets and a picnic area, and can also be seen from the car park.","url":null,"lat":-38.5347,"lng":177.6036,"trail":null,"difficulty":null,"verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":true,"gem":false,"kids":true,"hike":false,"south":false},{"id":"dawsonfalls","name":"Dawson Falls","place":"Taranaki, Te Papa-Kura-o-Taranaki National Park (Dawson Falls)","cat":"falls","detail":"18 m waterfall over rugged lava formations, reached by an easy 250 m walk with steps. Stop at the lookout or carry on down to the base. The falls are culturally significant to Māori, so stay out of the water.","url":"https://www.taranaki.co.nz/visit/highlights-of-taranaki/top-5-hikes-in-taranaki","lat":-39.32533,"lng":174.10723,"trail":"250 m one way","difficulty":"Easy, with steps","verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":true,"gem":false,"kids":true,"hike":false,"south":false},{"id":"pouakaitarns","name":"Mangorei Track to Pouākai Tarns","place":"Taranaki, Mangorei Road near New Plymouth","cat":"hikes","detail":"Steady climb from the end of Mangorei Road to Pouākai Hut, then 700 m on to the tarns where Taranaki Maunga reflects on still days. Allow about 2 to 2.5 hours one way; it takes several hours of uphill walking and good fitness. The car park is 13.6 km up Mangorei Road, about 20 minutes from New Plymouth; snow and ice are common up high in winter.","url":"https://www.doc.govt.nz/parks-and-recreation/places-to-go/taranaki/places/te-papa-kura-o-taranaki/things-to-do/tracks/mangorei-track/","lat":-39.23517,"lng":174.03744,"trail":"About 2 to 2.5 hours one way","difficulty":"Intermediate","verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":false,"hike":true,"south":false,"seasonNote":"Snow and ice common on higher parts in winter (DOC)."},{"id":"wilkiespools","name":"Wilkies Pools Loop","place":"Taranaki, Dawson Falls","cat":"hikes","detail":"1.9 km loop to smooth volcanic rock pools, suited to all ages and accessible for prams and wheelchairs. The rocks around the pools can be slippery. The pools are culturally significant to Māori, so stay out of the water.","url":"https://www.taranaki.co.nz/visit/highlights-of-taranaki/top-5-hikes-in-taranaki","lat":-39.31825,"lng":174.1002,"trail":"1.9 km loop","difficulty":"Easy","verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":true,"south":false},{"id":"manganuigorge","name":"Manganui Gorge Track and Suspension Bridge","place":"Taranaki, Stratford Plateau","cat":"hikes","detail":"From the top of the Stratford Plateau car park, about 900 m (20 minutes uphill) leads to a 100 m suspension bridge 49.5 m above the gorge, opened in May 2024, then 300 m on to the Manganui skifield. Boardwalks cross deep gullies with views over farmland to the coast. It is alpine and can be icy in winter; turn back if wind makes the bridge unsafe.","url":"https://www.doc.govt.nz/parks-and-recreation/places-to-go/taranaki/places/te-papa-kura-o-taranaki/things-to-do/tracks/manganui-gorge-track/","lat":-39.308927,"lng":174.09759,"trail":"About 1.2 km one way, 25 to 30 min","difficulty":"Easy, rocky and uneven in places","verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":true,"gem":false,"kids":true,"hike":true,"south":false,"seasonNote":"Can be very icy in winter (DOC)."},{"id":"lakemangamahoe","name":"Lake Mangamahoe Loop","place":"Taranaki, near New Plymouth","cat":"hikes","detail":"6 km loop through pine forest and along the lake edge, with viewpoints of Taranaki Maunga. It is a short drive from New Plymouth and popular with walkers and runners.","url":"https://www.taranaki.co.nz/visit/highlights-of-taranaki/top-5-hikes-in-taranaki","lat":-39.11824,"lng":174.1202,"trail":"6 km loop","difficulty":null,"verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":true,"south":false},{"id":"tematapeak","name":"Te Mata Peak","place":"Hawke's Bay, Havelock North","cat":"hikes","detail":"399 m peak above Havelock North, gifted to the public as a park in 1927, with a road to the summit lookout and many walking and biking trails. The Te Mata Park Trust closes the park and summit road at times of extreme fire risk, as in January 2026, so check its notices in summer.","url":"https://tematapark.co.nz","lat":-39.70139,"lng":176.90917,"trail":null,"difficulty":null,"verify":true,"day":"18","distance":null,"north":true,"indoor":false,"quick":true,"gem":false,"kids":true,"hike":true,"south":false,"wiki":"Te_Mata_Peak"},{"id":"cookscove","name":"Cooks Cove Walkway","place":"Gisborne, Tolaga Bay (Uawa)","cat":"hikes","detail":"A 5.8 km return walk (about 2.5 hours) from the southern end of Tolaga Bay, crossing a paddock and climbing to a lookout before dropping to Cooks Cove, where Cook stopped in 1769. The cove has the hole in the rock (Te Kotere o te Whenua), a 1966 memorial and a safe swimming spot. Bring water; dogs, camping and bikes are not allowed.","url":null,"lat":-38.382221,"lng":178.317311,"trail":null,"difficulty":null,"verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"hike":true,"south":false},{"id":"eastcapelighthouse","name":"East Cape Lighthouse","place":"Gisborne, East Cape (via Te Araroa)","cat":"hikes","detail":"Lighthouse on Otiki Hill above East Cape, the easternmost point of the North Island. The area around the light can be reached on foot, but the lighthouse itself is not open to the public.","url":null,"lat":-37.688944,"lng":178.548139,"trail":null,"difficulty":null,"verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"hike":true,"south":false},{"id":"pilotbay","name":"Waikorire (Pilot Bay)","place":"Bay of Plenty, Mount Maunganui","cat":"outdoors","detail":"Calm harbour beach on the opposite side of Mount Maunganui from Main Beach, good for swimming and picnics. It is known for sunsets and for watching cruise ships come into the harbour.","url":null,"lat":-37.63687,"lng":176.17806,"trail":null,"difficulty":null,"verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":true,"gem":false,"kids":true,"hike":false,"south":false},{"id":"ohopebeach","name":"Ōhope Beach","place":"Bay of Plenty, Ōhope","cat":"outdoors","detail":"13 km of h to Hāwera around the western side of Taranaki. The road often runs inland, so take side roads to beaches and stops such as Ōpunake and Cape Egmont Lighthouse. Mountain views depend on clear weather.","url":null,"lat":-39.45,"lng":173.85,"trail":null,"difficulty":null,"verify":false,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false},{"id":"threesisters","name":"Three Sisters and Elephant Rock","place":"North Taranaki, Tongapōrutu","cat":"outdoors","detail":"Sea stacks at the Tongapōrutu river mouth; there are now two sisters, and Elephant Rock lost its trunk to erosion in 2016. At low tide you can walk along the river and around the point to them; Pilot Road off SH3 north of the bridge gives views, and Clifton Road south of the bridge gets you to the sand. Plan to go within about two hours of low tide.","url":"https://www.newzealand.com/au/feature/three-sisters-and-the-elephant/","lat":-38.829796,"lng":174.577314,"trail":null,"difficulty":null,"verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false,"seasonNote":"Tide dependent: go within about two hours of low tide."},{"id":"morere","name":"Nga Hua o Mōrere Hot Springs","place":"Mōrere, SH2 between Wairoa and Gisborne","cat":"wellness","detail":"DOC hot pools fed by hot ancient sea water, piped to public and private pools in native rainforest inside Mōrere Springs Scenic Reserve. Hawke's Bay Tourism says the springs have reopened after a long closure for septic system work. Open Thursday to Monday 10am to 5pm, closed Tuesday and Wednesday; adults $20, children $12.","url":"https://doc.govt.nz/parks-and-recreation/places-to-go/east-coast/places/morere-springs-area/nga-hua-o-morere","lat":-38.9807,"lng":177.78919,"trail":null,"difficulty":null,"verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":fa e evening before. Adults $169, children $85; no children under 6.","url":"https://moutohora.co.nz","lat":-37.949814,"lng":177.0021421,"trail":null,"difficulty":null,"verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false,"wiki":"Moutohora_Island"},{"id":"waimarinoglow","name":"Waimarino Evening Glowworm Kayak Tour","place":"Tauranga, Lake McLaren","cat":"wildlife","detail":"An evening kayak trip on Lake McLaren toward the Mangapapa Canyon to see glowworms, starting with a tasting of local cheese, honey and kombucha. It departs around sunset; hotel transfers cost an extra $45. Adults $265 to $280.","url":"https://glowwormkayaking.com/tour/evening-glowworm-kayak-tour/","lat":-37.6988502,"lng":176.0989947,"trail":null,"difficulty":null,"verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"hike":false,"south":false},{"id":"dolphinseafaris","name":"Dolphin Seafaris","place":"Tauranga, Bridge Marina","cat":"wildlife","detail":"A 6 hour boat trip from Tauranga Bridge Marina to watch, and swim with, wild dolphins in the Bay of Plenty. Swim gear, hot drinks and light snacks are included, with a free return trip if no dolphins are found. Trips run October or November to May.","url":"https://www.nzdolphin.com/dolphin-encounters","lat":-37.6713243,"lng":176.1793189,"trail":null,"difficulty":null,"verify":true,"day":null,"distance":null,"north":true,"indoor":false,"quick":false,"gem":false,"kids":true,"hike":false,"south":false,"closedMonths":[6,7,8,9],"best":[1,2,3,4,5,11,12],"bestSet":true,"seasonNote":"Listing gives November to May in text and October to May in its months list."},{"id":"mtg","name":"MTG Hawke's Bay","place":"Napier, city centre","cat":"history","detail":"Napier's museum, theatre and gallery, with changing exhibitions of art, culture and social history, a Taonga Māori gallery and the story of the region's recovery after the 1931 earthquake. E
